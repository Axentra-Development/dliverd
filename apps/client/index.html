<title>Dliverd</title>
<style>
:root{
  --paper:#F3F6F4;--surface:#FFFFFF;--raise:#FAFBFA;--sunk:#EDF1EF;
  --ink:#111917;--body:#2B3733;--muted:#65726E;--faint:#8B9793;
  --line:#DCE1DE;--line-mid:#C3CBC7;
  --acc:#0F6455;--acc-ink:#0B4E42;--acc-soft:#E3EFEB;--acc-line:#9FC9BE;
  --risk:#93301F;--risk-soft:#F8E9E5;--risk-line:#DFB6AC;
  --warn:#7C5A0E;--warn-soft:#F6EEDC;
  --dark:#0C1211;--dark2:#141C1A;--dkl:#31403C;--dkm:#8B9994;--dka:#54C1A6;--dka2:#7FD5BF;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1a2220}
body{margin:0;color:var(--body);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;line-height:1.45}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 16px;
  background:radial-gradient(1200px 600px at 50% -10%,#2a3a36 0%,#121816 55%,#0b100f 100%)}
.phone{width:390px;height:844px;background:#000;border-radius:54px;padding:11px;position:relative;
  box-shadow:0 0 0 1px #2c3331,0 28px 80px rgba(0,0,0,.55),inset 0 0 0 1px #3d4542}
.phone-screen{height:100%;background:var(--paper);border-radius:44px;overflow:hidden;position:relative;
  display:flex;flex-direction:column}
.island{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:118px;height:34px;
  background:#0a0d0c;border-radius:20px;z-index:40;pointer-events:none}
.osbar{position:absolute;top:0;left:0;right:0;height:54px;z-index:30;display:flex;align-items:flex-end;
  justify-content:space-between;padding:0 28px 10px;color:#111;font-size:14px;font-weight:700;
  pointer-events:none}
.osbar.light{color:#EBF1EE}
.osbar .sig{display:flex;align-items:center;gap:5px}
.osbar svg{display:block}
.homeind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:128px;height:5px;
  background:#111;border-radius:4px;opacity:.28;z-index:30;pointer-events:none}
.homeind.on-dark{background:#fff;opacity:.45}
#app,#gate{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#gate{background:var(--dark);color:#C0CCC7}
@media (max-width:480px){
  .stage{padding:0;background:#000;min-height:100dvh}
  .phone{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none}
  .phone-screen{border-radius:0}
}
html.native,html.native body{background:var(--paper);height:100%;overflow:hidden}
html.native .stage{padding:0;background:var(--paper);min-height:100%;min-height:100dvh}
html.native .phone{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:var(--paper)}
html.native .phone-screen{border-radius:0;height:100%}
html.native .island,html.native .osbar,html.native .homeind{display:none}
html.native .bar{padding-top:max(10px,env(safe-area-inset-top))}
html.native .nav{padding-bottom:max(10px,env(safe-area-inset-bottom))}

.loginwrap{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;justify-content:center;padding:62px 22px 36px}
.loginwrap .lg{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.loginwrap .lg .dmark{width:28px;height:21px}
.bar .r1 .dmark{width:22px;height:17px}
.loginwrap h1{font-size:24px;color:var(--ink);letter-spacing:-.02em;line-height:1.2}

.loginwrap .field{margin-top:20px}
.loginwrap .actions{margin-top:16px}
.loginwrap .pindots{margin-top:22px}
.loginwrap .pindots i{border-color:var(--line-mid)}
.loginwrap .pindots i.on{background:var(--acc);border-color:var(--acc)}
.loginwrap .pindots.err i{border-color:var(--risk);background:var(--risk-soft)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px auto 0;width:100%;max-width:280px}
.pinpad button{height:54px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line-mid);
  color:var(--ink);font-family:var(--mono);font-size:22px;font-weight:700}

.choices{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.choice{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;

.choice .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.choice b{display:block;color:var(--ink);font-size:15px;font-weight:800}
.choice span{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.45;font-weight:500}
.idpill{display:inline-flex;align-items:center;gap:8px;background:var(--acc-soft);
 border:1px solid var(--acc-line);border-radius:20px;padding:7px 14px;font-size:13px;
 font-weight:700;color:var(--acc-ink);margin-top:4px}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
input{font-family:inherit;font-size:15px;color:var(--ink);border:1.5px solid var(--line-mid);
  border-radius:6px;padding:12px;background:var(--surface);width:100%}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
.mono{font-family:var(--mono)}
.sp{flex:1 1 auto}
.bar{flex:0 0 auto;z-index:10;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(16px);

.bar .r1{display:flex;align-items:center;gap:10px;padding:8px 15px 10px}
.brand{font-weight:800;font-size:13.5px;letter-spacing:.16em;color:var(--ink)}
.sub{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 16px}
.card{background:var(--surface);border:1px solid var(--line-mid);border-radius:10px;
  margin-bottom:12px;overflow:hidden}
.card .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;background:var(--raise);

.main>:last-child{margin-bottom:0}
.pill{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.06em;

.pill.acc{color:var(--acc-ink);border-color:var(--acc-line);background:var(--acc-soft)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;

.btn.danger{background:var(--surface);color:var(--risk);border:1.5px solid var(--risk-line);font-weight:700}
.btn.ghost{background:none;color:var(--muted);min-height:44px;font-weight:600;font-size:13.5px;padding:8px 12px}
.btn.sm{min-height:44px;font-size:13.5px}
.btn:disabled{opacity:.4;pointer-events:none}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.dock{flex:0 0 auto;padding:10px 12px 8px;background:rgba(255,255,255,.94);

  border-top:1px solid var(--line-mid);display:flex;flex-direction:column;gap:8px}
.dock .btn{margin:0}
.navrow{display:flex;gap:7px;margin-top:9px}

.navbtn:active{background:var(--raise)}
.navbtn svg{width:14px;height:14px;flex:0 0 auto;stroke:currentColor;stroke-width:1.8;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.note{display:flex;gap:9px;padding:11px 13px;font-size:12.5px;line-height:1.5;border-radius:8px;margin-bottom:12px}
.note.acc{background:var(--acc-soft);color:var(--acc-ink);border:1px solid var(--acc-line)}
.note.risk{background:var(--risk-soft);color:var(--risk);border:1px solid var(--risk-line)}
.note.warn{background:var(--warn-soft);color:var(--warn);border:1px solid #DDC386}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}

.kv .k{color:var(--muted)} .kv .v{color:var(--ink);font-weight:700;text-align:right}
.label{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);margin:14px 2px 7px}
.hero{background:var(--dark);border-radius:12px;color:#C0CCC7;padding:16px;margin-bottom:12px}
.hero .eyeb{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--dka)}
.hero h2{color:#fff;font-size:18px;font-weight:800;margin-top:6px;line-height:1.25}
.hero .m{font-size:12px;color:var(--dkm);margin-top:4px;line-height:1.45}
.hero .row{display:flex;gap:8px;margin-top:14px;align-items:stretch}
.hero .b1{flex:1 1 auto;min-height:48px;border-radius:10px;background:var(--dka);color:var(--dark);
  font-weight:800;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 12px;line-height:1.2;text-align:center}
.hero .b2{flex:0 0 auto;min-height:48px;border-radius:10px;border:1.5px solid var(--dkl);color:#C0CCC7;
  font-weight:700;font-size:14px;padding:10px 16px;display:flex;align-items:center;justify-content:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line-mid);border-radius:10px;padding:14px;
  min-height:78px;display:flex;flex-direction:column;justify-content:space-between}
.tile .v{font-family:var(--mono);font-size:22px;font-weight:800;color:var(--ink);line-height:1.1}
.tile .v.acc{color:var(--acc)}
.tile .k{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.25}
.step{display:flex;gap:12px;padding:0 4px}
.step .rail{width:22px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center}
.step .node{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-mid);background:var(--surface);flex:0 0 auto;margin-top:4px}
.step.on .node{background:var(--acc);border-color:var(--acc)}
.step.now .node{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft);background:var(--surface)}
.step .line{flex:1 1 auto;width:2px;background:var(--line);min-height:18px;margin:4px 0}
.step.on .line{background:var(--acc-line)}
.step .body{flex:1 1 auto;min-width:0;padding-bottom:14px}
.step .body b{display:block;font-size:13.5px;color:var(--ink)}
.step.now .body b{color:var(--acc-ink)}
.step .body span{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.codebox{background:var(--dark);border-radius:12px;padding:22px 16px 18px;text-align:center;margin-bottom:12px;color:#C0CCC7}
.codebox .eyeb{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dka)}
.codebox .digits{display:flex;gap:7px;justify-content:center;margin:16px 0 10px}
.codebox .digits i{width:42px;height:56px;border-radius:8px;background:var(--dark2);border:1px solid var(--dkl);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:26px;font-weight:800;color:#EBF1EE}
.codebox p{font-size:12.5px;color:var(--dkm);line-height:1.5}
.lockcard{background:var(--sunk);border:1.5px solid var(--line-mid);border-radius:10px;
  padding:22px 16px;text-align:center;margin-bottom:12px}
.lockcard h3{color:var(--ink);font-size:16px;margin-top:4px}

.done-wrap{text-align:center;padding:28px 16px 8px}
.done-ring{width:86px;height:86px;border-radius:50%;background:var(--acc-soft);margin:0 auto 14px;

.nav button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--faint);font-size:9px;font-weight:700;padding:4px 0;position:relative}

.nav svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

  background:var(--risk);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;
  justify-content:center;padding:0 4px}

  background:var(--ink);color:#EBF1EE;font-size:13px;font-weight:700;padding:11px 17px;
  border-radius:8px;transition:transform .25s,opacity .25s;z-index:60;max-width:86%;text-align:center;
  opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.phone-screen:has(.dock) .toast{bottom:176px}
html.native .phone-screen:has(.dock) .toast{bottom:calc(176px + env(safe-area-inset-bottom))}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.splash,.lock{height:100%;width:100%;display:flex;flex-direction:column;align-items:center;padding:88px 28px 36px;text-align:center}
.splash .lockup,.lock .lockup{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:18px}
.splash .lockup .dmark,.lock .lockup .dmark{width:48px;height:36px}

.face{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--dkl);background:var(--dark2);
  color:var(--dka2);display:flex;align-items:center;justify-content:center;margin:22px auto 0}
.face:active,.face.busy{background:#1E2C29}
.face.busy{animation:pulse 1.2s infinite}
.face svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pindots{display:flex;gap:12px;justify-content:center;margin:18px 0 8px}

.pindots i.on{background:var(--dka);border-color:var(--dka)}
.pindots.err i{border-color:#A63A26;background:#2C1A16}
.map{height:120px;border-bottom:1px solid var(--line)}

 if($('#goOrder'))$('#goOrder').onclick=()=>{S.tab='order';render();};
 if($('#sim'))$('#sim').onclick=nextDemo;
 if($('#dockCode'))$('#dockCode').onclick=()=>{S.tab='code';render();};
 if($('#rep'))$('#rep').onclick=()=>{S.reprise='ready';S.tab='code';toast('Same code — this time to release the trade-in');render();};
}
function vCode(){
 const c=me();
 const trade=c.tradeIn&&S.leg==='done'&&S.reprise==='ready';
 if(S.leg==='done'&&!trade){
  shell(`<div class="done-wrap">
    <div class="done-ring">${ic('check')}</div>
    <h2>${S.reprise==='done'?'Visit complete':'It’s yours'}</h2>
    <p>Code ${DOOR_CODE.split('').join(' ')} was verified, then you signed on Maya’s screen. Both proofs are on the ledger.</p>
   </div>
   <div class="card"><div class="bd">
    <div class="kv"><span class="k">Box</span><span class="v mono">${c.box}</span></div>
    <div class="kv"><span class="k">Driver</span><span class="v">${DRIVER.short} · ${DRIVER.code}</span></div>
    ${S.reprise==='done'?`<div class="kv"><span class="k">Trade-in</span><span class="v">${c.tradeIn.model} released</span></div>`:''}
   </div></div>`);
  return;
 }
 if(S.leg!=='door'&&!trade){
  shell(`
   <div class="lockcard">
    <h3>Code locked</h3>
    <p>The 6-digit handover code only appears when Maya is <b>inside 100 m</b> of ${c.addr.split(',')[0]}. That is the same geofence that unlocks her scanner — a delivery cannot complete anywhere else.</p>
   </div>
   <div class="note acc"><div><b>Maya never sees this code in her app.</b> You show it. She types it. Then you sign. Both, every time.</div></div>
   <div class="card"><div class="hd">When it unlocks</div><div class="bd">
    <div class="kv"><span class="k">Now</span><span class="v">${LEG_COPY[S.leg].eyeb}</span></div>
    <div class="kv"><span class="k">ETA</span><span class="v">${c.eta}${c.deadline?' · by '+c.deadline:''}</span></div>
   </div></div>
   <button class="btn ghost" id="sim">DEMO · jump to “at the door”</button>`);
  $('#sim').onclick=()=>{S.leg='door';toast('Maya is at your door');render();};
  return;
 }
 shell(`
  <div class="codebox">
   <div class="eyeb">${trade?'Trade-in release':'Show Maya'}</div>
   <div class="digits">${DOOR_CODE.split('').map(d=>`<i>${d}</i>`).join('')}</div>
   <p>${trade
    ?`Same digits as the delivery. Maya types them, then you sign the ${c.tradeIn.model} away.`
    :'She cannot see these digits. Keep the screen facing her until she confirms, then sign on her iPhone.'}</p>
  </div>
  <div class="note acc"><div><b>Expires with this visit.</b> Attempt 1 of 5 on her side. If you close the app, the code is still valid until she leaves the geofence.</div></div>
  <div class="card"><div class="hd">${trade?'Releasing':'Receiving'} <div class="sp"></div><span class="pill acc">${c.box}</span></div>
   <div class="bd">
    <div class="kv"><span class="k">Photo ID name</span><span class="v">${c.full}</span></div>
    <div class="kv"><span class="k">Address</span><span class="v">${c.addr}</span></div>
   </div></div>
  ${contactDriver()}`,
  `<button class="btn" id="signed">${trade?'I signed the trade-in release':'I signed on Maya’s screen'}</button>
   <button class="btn danger" id="exc">I’m not here / problem</button>`);
 $('#signed').onclick=()=>{
  if(trade){S.reprise='done';toast('Trade-in in Maya’s custody · grade pending');}
  else {S.leg='done';toast('Delivered · chain of custody closed');}
  render();
 };
 $('#exc').onclick=()=>{
  S.leg='enroute';S.reprise='idle';
  toast('Told Maya to keep custody — she will not leave the device',true);S.tab='live';render();
 };
}
function vOrder(){
 const c=me();
 shell(`
  <div class="card"><div class="hd">${c.provider} · ${c.order} <div class="sp"></div>
    <span class="pill ${S.leg==='done'?'acc':'warn'}">${S.leg==='done'?'Delivered':'In custody'}</span></div>
   <div class="bd">
    <div class="kv"><span class="k">Box</span><span class="v mono">${c.box}</span></div>
    <div class="kv"><span class="k">Deliver to</span><span class="v">${c.addr}</span></div>
    <div class="kv"><span class="k">Window</span><span class="v">${c.eta}${c.deadline?' · by '+c.deadline:''}</span></div>
    <div class="kv"><span class="k">Declared value</span><span class="v">$${c.value.toLocaleString()} · covered</span></div>
   </div></div>
  <div class="label">Device${c.devices.length>1?'s':''} in the box</div>
  <div class="card"><div class="bd">
   ${c.devices.map(d=>`<div class="kv"><span class="k">${d.model}</span>
     <span class="v mono">${S.leg==='done'?d.imei:'IMEI sealed'}</span></div>`).join('')}
  </div></div>
  ${c.tradeIn?`<div class="label">Same visit · trade-in</div>
   <div class="card"><div class="bd">
    <div class="kv"><span class="k">Device</span><span class="v">${c.tradeIn.model}</span></div>
    <div class="kv"><span class="k">IMEI</span><span class="v mono">${c.tradeIn.imei}</span></div>
    <div class="kv"><span class="k">Return-leg cover</span><span class="v">$${c.tradeIn.cover} · grade B est.</span></div>
    <div class="kv"><span class="k">Status</span><span class="v">${S.reprise==='done'?'Released to Maya':S.leg==='done'?'Ready at the door':'After the new phone'}</span></div>
   </div></div>`:''}
  <div class="note acc"><div><b>Guarantee:</b> if Maya misses ${c.deadline||'the window'}, this visit is free. The device still cannot change hands outside the geofence.</div></div>`);
}
function vProfile(){
 const c=me();
 shell(`
  <div class="card"><div class="hd">${c.full}</div>
   <div class="bd">
    <div class="kv"><span class="k">Phone</span><span class="v">${c.phone}</span></div>
    <div class="kv"><span class="k">Email</span><span class="v" style="word-break:break-all">${c.email}</span></div>
    <div class="kv"><span class="k">Unlock on this iPhone</span><span class="v">${S.auth.lock==='face'?'Face ID':'PIN · OTP each open'}</span></div>
    <div class="kv"><span class="k">Language</span><span class="v">Français / English</span></div>
   </div></div>
  <div class="card"><div class="hd">Past visits</div><div class="bd">
   <div class="kv"><span class="k">12 Aug · BMobile BM-0988</span><span class="v"><span class="pill acc">Delivered</span></span></div>
   <div class="kv"><span class="k">Today · ${c.order}</span><span class="v"><span class="pill ${S.leg==='done'?'acc':'warn'}">${S.leg==='done'?'Delivered':'Live'}</span></span></div>
  </div></div>
  <div class="note acc" style="margin-bottom:0"><div><b>Your code is never in Maya’s app.</b> If someone at the door cannot show these six digits, she keeps the box.</div></div>`,
  `<button class="btn alt" id="callDisp">Help · 24/7</button>
   <button class="btn ghost" id="signout">Lock the app</button>
   <button class="btn ghost" id="unlink">Unlink this iPhone</button>`);
 $('#callDisp').onclick=()=>toast('Calling Dliverd support');
 $('#signout').onclick=()=>{restoreDeviceAuth();toast('Locked');render();};
 $('#unlink').onclick=unlinkPhone;
}
function render(){
 tickClock();
 if(S.gate==='splash')return vSplash();
 if(!S.auth.logged)return vLogin();
 $('#gate').style.display='none';
 $('#gate').innerHTML='';
 $('#app').style.display='flex';
 setChrome(false);
 if(S.tab==='live')return vLive();
 if(S.tab==='code')return vCode();
 if(S.tab==='order')return vOrder();
 return vProfile();
}
setInterval(tickClock,10000);
(function bootDemo(){
 const q=new URLSearchParams(location.search);
 const demo=q.get('demo');
 if(!demo){restoreDeviceAuth();return;}
 const c=CLIENTS[demo]||lookupClient(demo);
 if(!c){restoreDeviceAuth();return;}
 S.gate='app';
 S.auth.logged=true;
 S.auth.id=c.phone;
 S.auth.lock='face';
 S.auth.method='phone';
 if(LEGS.includes(q.get('leg')))S.leg=q.get('leg');
 if(['live','code','order','profile'].includes(q.get('tab')))S.tab=q.get('tab');
 if(q.get('reprise'))S.reprise=q.get('reprise');
})();
render();
</script></body></html>
