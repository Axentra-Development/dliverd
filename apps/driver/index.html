<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Custode">
<meta name="theme-color" content="#0C1211">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>Custode</title>
<style>
:root{
  --paper:#F3F6F4;--surface:#FFFFFF;--raise:#FAFBFA;--sunk:#EDF1EF;
  --ink:#111917;--body:#2B3733;--muted:#65726E;--faint:#8B9793;
  --line:#DCE1DE;--line-mid:#C3CBC7;
  --acc:#0F6455;--acc-ink:#0B4E42;--acc-soft:#E3EFEB;--acc-line:#9FC9BE;
  --risk:#93301F;--risk-soft:#F8E9E5;--risk-line:#DFB6AC;
  --warn:#7C5A0E;--warn-soft:#F6EEDC;
  --dark:#0C1211;--dark2:#141C1A;--dkl:#31403C;--dkm:#8B9994;--dka:#54C1A6;--dka2:#7FD5BF;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1a2220}
body{margin:0;color:var(--body);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;line-height:1.45}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 16px;
  background:radial-gradient(1200px 600px at 50% -10%,#2a3a36 0%,#121816 55%,#0b100f 100%)}
.phone{width:390px;height:844px;background:#000;border-radius:54px;padding:11px;position:relative;
  box-shadow:0 0 0 1px #2c3331,0 28px 80px rgba(0,0,0,.55),inset 0 0 0 1px #3d4542}
.phone-screen{height:100%;background:var(--paper);border-radius:44px;overflow:hidden;position:relative;
  display:flex;flex-direction:column}
.island{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:118px;height:34px;
  background:#0a0d0c;border-radius:20px;z-index:40;pointer-events:none}
.osbar{position:absolute;top:0;left:0;right:0;height:54px;z-index:30;display:flex;align-items:flex-end;
  justify-content:space-between;padding:0 28px 10px;color:#111;font-size:14px;font-weight:700;
  pointer-events:none}
.osbar.light{color:#EBF1EE}
.osbar .sig{display:flex;align-items:center;gap:5px}
.osbar svg{display:block}
.homeind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:128px;height:5px;
  background:#111;border-radius:4px;opacity:.28;z-index:30;pointer-events:none}
.homeind.on-dark{background:#fff;opacity:.45}
#app,#gate{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#gate{background:var(--dark);color:#C0CCC7}
@media (max-width:480px){
  .stage{padding:0;background:#000;min-height:100dvh}
  .phone{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none}
  .phone-screen{border-radius:0}
}
html.native,html.native body{background:var(--paper);height:100%;overflow:hidden}
html.native .stage{padding:0;background:var(--paper);min-height:100%;min-height:100dvh}
html.native .phone{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:var(--paper)}
html.native .phone-screen{border-radius:0;height:100%}
html.native .island,html.native .osbar,html.native .homeind{display:none}
html.native .bar{padding-top:max(10px,env(safe-area-inset-top))}
html.native .nav{padding-bottom:max(10px,env(safe-area-inset-bottom))}
html.native .splash,html.native .lock{padding-top:max(72px,calc(env(safe-area-inset-top) + 36px))}
html.native .toast{bottom:calc(108px + env(safe-area-inset-bottom))}
html.native .loginwrap{padding-top:max(36px,calc(env(safe-area-inset-top) + 20px));
  padding-bottom:max(28px,calc(env(safe-area-inset-bottom) + 16px))}
html.native .dock{padding-bottom:8px}
/* login */
.loginwrap{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;justify-content:center;padding:62px 22px 36px}
.loginwrap .lg{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.loginwrap h1{font-size:24px;color:var(--ink);letter-spacing:-.02em;line-height:1.2}
.loginwrap .sub2{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.55}
.loginwrap .field{margin-top:20px}
.loginwrap .actions{margin-top:16px}
.idpill{display:inline-flex;align-items:center;gap:8px;background:var(--acc-soft);
 border:1px solid var(--acc-line);border-radius:20px;padding:7px 14px;font-size:13px;
 font-weight:700;color:var(--acc-ink);margin-top:4px}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
input{font-family:inherit;font-size:15px;color:var(--ink);border:1.5px solid var(--line-mid);
  border-radius:6px;padding:12px;background:var(--surface);width:100%}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
.mono{font-family:var(--mono)}
.sp{flex:1 1 auto}
.bar{flex:0 0 auto;z-index:10;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line-mid);padding-top:54px}
.bar .r1{display:flex;align-items:center;gap:10px;padding:8px 15px 10px}
.brand{font-weight:800;font-size:13.5px;letter-spacing:.16em;color:var(--ink)}
.sub{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.chip-on{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;
  padding:8px 14px;border-radius:20px;background:var(--acc);color:#fff}
.chip-on.off{background:var(--sunk);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#7FD5BF;animation:pulse 1.6s infinite}
.chip-on.off .dot{background:var(--faint);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 16px}
.card{background:var(--surface);border:1px solid var(--line-mid);border-radius:10px;
  margin-bottom:12px;overflow:hidden}
.card .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;background:var(--raise);
  border-bottom:1px solid var(--line);font-weight:800;color:var(--ink);font-size:14px;line-height:1.3}
.card .bd{padding:13px 14px}
.main>:last-child{margin-bottom:0}
.pill{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 7px;border:1px solid var(--line-mid);border-radius:3px;
  color:var(--muted);background:var(--surface);white-space:nowrap}
.pill.acc{color:var(--acc-ink);border-color:var(--acc-line);background:var(--acc-soft)}
.pill.risk{color:var(--risk);border-color:var(--risk-line);background:var(--risk-soft)}
.pill.warn{color:var(--warn);border-color:#DDC386;background:var(--warn-soft)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:48px;border-radius:10px;background:var(--acc);color:#fff;font-size:15px;font-weight:800;
  padding:10px 14px;line-height:1.2;text-align:center}
.btn:active{transform:scale(.99)}
.btn.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line-mid);font-weight:700}
.btn.danger{background:var(--surface);color:var(--risk);border:1.5px solid var(--risk-line);font-weight:700}
.btn.ghost{background:none;color:var(--muted);min-height:44px;font-weight:600;font-size:13.5px;padding:8px 12px}
.btn.sm{min-height:44px;font-size:13.5px}
.btn:disabled{opacity:.4;pointer-events:none}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.actions.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch}
.actions.row>.btn{width:100%;min-width:0;flex:none}
.dock{flex:0 0 auto;padding:10px 12px 8px;background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line-mid);display:flex;flex-direction:column;gap:8px}
.dock .btn{margin:0}
.card.tools .bd{padding:12px}
.card.tools .navrow{margin-top:0}
.card.tools .navrow+.navrow{margin-top:8px}
.stop-actions{margin-top:10px;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.stop-actions .navrow{margin-top:0}
.seg{display:inline-flex;border:1.5px solid var(--line-mid);border-radius:8px;overflow:hidden}
.seg button{padding:7px 12px;font-size:12px;font-weight:800;color:var(--muted);min-width:44px}
.seg button.on{background:var(--acc);color:#fff}
.note{display:flex;gap:9px;padding:11px 13px;font-size:12.5px;line-height:1.5;border-radius:8px;margin-bottom:12px}
.note.acc{background:var(--acc-soft);color:var(--acc-ink);border:1px solid var(--acc-line)}
.note.risk{background:var(--risk-soft);color:var(--risk);border:1px solid var(--risk-line)}
.note.warn{background:var(--warn-soft);color:var(--warn);border:1px solid #DDC386}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)} .kv .v{color:var(--ink);font-weight:700;text-align:right}
.label{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);margin:14px 2px 7px}
/* dashboard tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line-mid);border-radius:10px;padding:14px;
  min-height:78px;display:flex;flex-direction:column;justify-content:space-between}
.tile .v{font-family:var(--mono);font-size:22px;font-weight:800;color:var(--ink);line-height:1.1}
.tile .v.acc{color:var(--acc)} .tile .v.risk{color:var(--risk)}
.tile .k{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.25}
.hero{background:var(--dark);border-radius:12px;color:#C0CCC7;padding:16px;margin-bottom:12px}
.hero .eyeb{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--dka)}
.hero h2{color:#fff;font-size:18px;font-weight:800;margin-top:6px;line-height:1.25}
.hero .m{font-size:12px;color:var(--dkm);margin-top:4px;line-height:1.45}
.hero .row{display:flex;gap:8px;margin-top:14px;align-items:stretch}
.hero .b1{flex:1 1 auto;min-height:48px;border-radius:10px;background:var(--dka);color:var(--dark);
  font-weight:800;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 12px;line-height:1.2;text-align:center}
.hero .b2{flex:0 0 auto;min-height:48px;border-radius:10px;border:1.5px solid var(--dkl);color:#C0CCC7;
  font-weight:700;font-size:14px;padding:10px 16px;display:flex;align-items:center;justify-content:center}
/* stops */
.stop{display:flex;gap:0;width:100%;text-align:left;background:var(--surface);
  border-bottom:1px solid var(--line);padding:0 14px 0 0}
.stop:last-child{border-bottom:0}
.stop:active{background:var(--raise)}
.rail{width:44px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding-top:14px}
.node{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;font-weight:700;flex:0 0 auto;
  border:2px solid var(--line-mid);background:var(--surface);color:var(--muted)}
.stop.done .node{background:var(--acc);border-color:var(--acc);color:#fff}
.stop.now .node{border-color:var(--acc);color:var(--acc-ink);box-shadow:0 0 0 4px var(--acc-soft)}
.stop.blocked .node{border-color:var(--risk-line);color:var(--risk)}
.railline{flex:1 1 auto;width:2px;background:var(--line);margin-top:4px}
.stop.done .railline{background:var(--acc-line)}
.scontent{flex:1 1 auto;min-width:0;padding:12px 0}
.shead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.stype{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--acc-ink);font-weight:700}
.stype.rev{color:var(--warn)} .stype.pick{color:var(--ink)}
.sname{font-size:14.5px;font-weight:800;color:var(--ink);line-height:1.25}
.stop.done .sname{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
.saddr{font-size:11.5px;color:var(--muted);margin-top:2px}
.smeta{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;align-items:center}
.seta{font-family:var(--mono);font-size:10.5px;color:var(--faint);width:52px;text-align:right;
  flex:0 0 auto;padding:14px 10px 0 0;font-weight:600}
.stop.now .seta{color:var(--acc);font-weight:700}
.earn{font-family:var(--mono);font-size:11px;color:var(--acc-ink);font-weight:700}
.navrow{display:flex;gap:7px;margin-top:9px}
.navbtn{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:5px;min-height:40px;
  border:1.5px solid var(--line-mid);border-radius:8px;font-size:11.5px;font-weight:700;color:var(--ink);
  background:var(--surface);text-decoration:none;padding:0 6px;white-space:nowrap;min-width:0}
.navbtn:active{background:var(--raise)}
.navbtn svg{width:14px;height:14px;flex:0 0 auto;stroke:currentColor;stroke-width:1.8;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.scontact{font-size:11.5px;color:var(--acc-ink);margin-top:3px;font-weight:600}
.stop.done .scontact{color:var(--faint);font-weight:500}
.map{height:120px;border-bottom:1px solid var(--line)}
/* gps */
.gpsline{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;
  padding:8px 12px;border-radius:7px;margin-bottom:10px;font-weight:700}
.gpsline.far{background:var(--risk-soft);color:var(--risk);border:1px solid var(--risk-line)}
.gpsline.near{background:var(--acc-soft);color:var(--acc-ink);border:1px solid var(--acc-line)}
.gpsdot{width:9px;height:9px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
.lockcard{background:var(--risk-soft);border:1.5px solid var(--risk-line);border-radius:10px;
  padding:18px 16px;text-align:center;margin-bottom:12px}
.lockcard .big{font-size:34px}
.lockcard h3{color:var(--risk);font-size:16px;margin-top:6px}
.lockcard p{font-size:12.5px;color:var(--risk);margin-top:6px;line-height:1.5}
.lockcard .btn{margin-top:12px}
.offbanner{background:var(--risk);color:#fff;border-radius:9px;padding:12px 14px;margin-bottom:12px;
  font-size:12.5px;line-height:1.5;font-weight:600;animation:slidein .3s}
.offbanner .btn{background:#fff;color:var(--risk);margin-top:10px}
/* scanner */
.scanview{background:var(--dark);border-radius:10px;overflow:hidden;margin-bottom:10px}
.boxrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.boxrow:last-child{border-bottom:0}
.boxrow>div:first-child{min-width:0;flex:1 1 auto}
.boxrow .bid{font-family:var(--mono);font-size:13px;font-weight:800;color:var(--ink)}
.boxrow .bfor{font-size:11px;color:var(--muted)}
.boxrow .scanb{margin-left:auto;min-height:40px;padding:0 14px;border-radius:8px;font-size:12px;
  font-weight:800;background:var(--acc);color:#fff;display:flex;align-items:center;gap:6px;flex:0 0 auto}
.boxrow.scanned .scanb{background:var(--acc-soft);color:var(--acc-ink);pointer-events:none}
.boxrow .scanb.ghost{background:var(--surface);color:var(--muted);border:1.5px solid var(--line-mid)}
.bigscan{display:flex;flex-direction:column;gap:8px}
.bigscan button{display:flex;align-items:center;gap:10px;border:1.5px solid var(--dkl);
  border-radius:8px;background:var(--dark2);color:#EBF1EE;padding:12px 14px;text-align:left}
.bigscan button:active{background:#1E2C29}
.bigscan .bid2{font-family:var(--mono);font-size:14px;font-weight:800;color:var(--dka2)}
.bigscan .bfor2{font-size:11px;color:var(--dkm)}
/* add-on offers */
.offer{border:2px solid var(--acc);border-radius:12px;overflow:hidden;margin-bottom:12px;
  animation:slidein .35s cubic-bezier(.2,1.3,.4,1);background:var(--surface)}
@keyframes slidein{0%{transform:translateY(-14px);opacity:0}100%{transform:none;opacity:1}}
.offer .top{display:flex;align-items:center;gap:9px;background:var(--acc);color:#fff;padding:9px 14px;
  font-size:12px;font-weight:800;letter-spacing:.04em}
.offer .timer{margin-left:auto;font-family:var(--mono);font-size:14px}
.offer .bd{padding:14px 16px 16px}
.offer .navrow{margin-top:10px}
.offer .actions{margin-top:10px}
.offer.quiet{border-color:var(--line-mid);animation:none}
.offer.quiet .top{background:var(--raise);color:var(--ink);border-bottom:1px solid var(--line)}
/* handover */
.hand{background:var(--dark);color:#C0CCC7;border-radius:12px;padding:16px 14px;margin-bottom:12px}
.hand h2{font-size:18px;font-weight:800;color:#fff;line-height:1.25}
.hand .sb{font-size:12px;color:var(--dkm);margin-top:5px;line-height:1.5}
.hand .btn.ghost{color:var(--dkm)}
.hand .actions{margin-top:12px}
.modeswitch{display:flex;border:1px solid var(--dkl);border-radius:8px;overflow:hidden;margin-top:14px}
.modeswitch button{flex:1 1 0;padding:10px;font-size:12.5px;font-weight:700;color:var(--dkm);background:var(--dark2)}
.modeswitch button.on{background:#12302A;color:var(--dka2)}
.otp{display:flex;gap:6px;justify-content:center;margin-top:16px}
.otp span{flex:1 1 0;max-width:46px;height:48px;border:1px solid var(--dkl);border-radius:8px;background:var(--dark2);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:22px;
  font-weight:700;color:#EBF1EE}
.otp span.f{border-color:var(--dka);background:#12302A}
.otp.err span{border-color:#A63A26;background:#2C1A16}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pad button{height:50px;border-radius:8px;background:var(--dark2);border:1px solid var(--dkl);
  color:#EBF1EE;font-family:var(--mono);font-size:20px}
.pad button:active{background:#1E2C29}
.pad .fn{font-size:11px;color:var(--dkm)}
.hmeta{display:flex;justify-content:space-between;margin-top:10px;font-family:var(--mono);
  font-size:10px;color:#6D7B76}
.hmeta b{color:var(--dka)}
.sigwrap{margin-top:14px;background:var(--dark2);border:1px dashed var(--dkl);border-radius:8px;overflow:hidden}
.sigwrap canvas{display:block;width:100%;height:150px;touch-action:none;cursor:crosshair}
.sighint{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:#6D7B76;text-align:center;padding:6px 0 8px}
/* scan / grade */
.scanrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.scanrow:last-child{border-bottom:0}
.scanrow input{width:20px;height:20px;flex:0 0 auto}
.scanrow .n{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.scanrow .m{font-size:11px;color:var(--muted)}
.chips{display:flex;gap:7px;margin-top:8px;align-items:stretch}
.chipG{flex:1 1 0;border:1.5px solid var(--line-mid);border-radius:8px;padding:10px 8px;text-align:left;background:var(--surface);min-height:58px}
.chipG.on{border-color:var(--acc);background:var(--acc-soft)}
.chipG .g{font-family:var(--mono);font-size:15px;font-weight:800;color:var(--ink)}
.chipG .l{font-size:9.5px;color:var(--muted);margin-top:2px;line-height:1.25}
.done-wrap{text-align:center;padding:30px 20px}
.done-ring{width:86px;height:86px;border-radius:50%;background:var(--acc-soft);margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;color:var(--acc);
  animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
.done-wrap h2{font-size:19px;color:var(--ink)}
.done-wrap p{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.55}
.done-wrap .money{font-family:var(--mono);font-size:26px;font-weight:800;color:var(--acc);margin-top:10px}
/* bottom nav */
.nav{flex:0 0 auto;z-index:10;display:flex;background:rgba(255,255,255,.9);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);

function wireVerify(demo,onDone){

  const k=b.dataset.k;S.otpErr=false;
  if(k==='clr')S.otp='';else if(k==='del')S.otp=S.otp.slice(0,-1);
  else if(S.otp.length<6)S.otp+=k;
  if(S.otp.length===6){

   else{S.otpErr=true;S.otp='';toast('Wrong code · attempt logged',true);}}
  render();});
 if(S.codeOk){
  const cv=$('#sig');if(!cv)return;
  const ctx=cv.getContext('2d');
  ctx.strokeStyle='#7FD5BF';ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';
  let down=false,last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;
   return[(t.clientX-r.left)*cv.width/r.width,(t.clientY-r.top)*cv.height/r.height];};
  cv.addEventListener('pointerdown',e=>{down=true;last=pos(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(!down)return;const p=pos(e);ctx.beginPath();
   ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p;S.sigDrawn=true;e.preventDefault();});
  window.addEventListener('pointerup',()=>{down=false;});
  $('#sigClr').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);S.sigDrawn=false;};
  $('#sigOk').onclick=()=>{
   if(!S.sigDrawn)return toast('Signature required — both proofs, every time',true);
   const nm=$('#signame').value.trim();
   if(!nm)return toast('Name from photo ID is required',true);
   onDone(nm);};
 }

  wireVerify('417826',nm=>{S.custody+=1;S.car.push('R-31907');S.phase='scan';resetVerify();
   finishStop(s,`Buyback in custody · grade ${S.grade} · released by ${nm} · +$${s.pay.toFixed(2)}`);});
  return;
 }
 shell(`
  <div class="card"><div class="hd">${s.name} <div class="sp"></div><span class="pill warn">REPRISE</span></div>
   <div class="bd">
    <div class="kv"><span class="k">Device</span><span class="v mono">351984406220071</span></div>
    ${contactKvs(s)}
    <div class="kv"><span class="k">Blacklist check</span><span class="v" style="color:var(--acc)">Clean · locks off</span></div>
    <div class="label">Condition grade</div>
    <div class="chips">${['A','B','C','D'].map(g=>`<button class="chipG ${S.grade===g?'on':''}" data-g="${g}">
      <div class="g">${g}</div><div class="l">${{A:'Like new',B:'Light wear',C:'Visible wear',D:'Damaged'}[g]}</div></button>`).join('')}</div>
    <div class="kv" style="margin-top:10px"><span class="k">Return-leg cover</span>
     <span class="v mono">${{A:'$580',B:'$520',C:'$390',D:'$120'}[S.grade]}</span></div>
   </div></div>
  ${toolsCard(s)}`,
  `<button class="btn" id="go">Photograph & seal — client verification</button>
   <button class="btn ghost" id="back">Back</button>`);
 $('#back').onclick=()=>{S.view=null;render();};
 document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S.grade=b.dataset.g;render();});
 $('#go').onclick=()=>{if(S.gps.dist>GEOFENCE_M)S.gps.dist=12;S.phase='verify';resetVerify();render();};
}
/* ── 3 · ADD-ONS ── */
function wireAddons(){
 document.querySelectorAll('[data-aacc]').forEach(b=>b.onclick=()=>{
  const a=S.addons.find(x=>x.id===b.dataset.aacc);a.state='accepted';
  S.stops.push({id:100+S.stops.length,type:a.info.includes('trade-in')||a.info.includes('RMA')?'REPRISE':'DELIVER',
   eta:'—',name:a.name,addr:a.addr,pay:a.pay,info:a.info,st:'',n:2,addon:true,
   phone:a.phone,tel:a.tel,email:a.email,contact:a.contact||'Store'});
  toast(`${a.name} added to your route · +$${a.pay.toFixed(2)}`);render();});
 document.querySelectorAll('[data-adec]').forEach(b=>b.onclick=()=>{
  const a=S.addons.find(x=>x.id===b.dataset.adec);a.state='declined';
  toast('Skipped — no effect on your route or rating');render();});
}
function vAddons(){
 const open=openAddons();
 shell(`
  ${!S.online?`<div class="note warn"><div><b>You're offline</b> — go online to receive add-on offers.</div></div>`:''}
  <div class="note acc"><div><b>Add-ons are extra pay on top of your route.</b> Accept or skip — skipping never affects your route or your standing. First accept wins across drivers.</div></div>
  ${open.length?open.map(a=>`
   <div class="offer ${a.hot?'':'quiet'}"><div class="top">${a.hot?'EXPIRES SOON':'AVAILABLE'}
     ${a.left!=null?`<span class="timer">0:${String(Math.max(0,a.left)).padStart(2,'0')}</span>`:''}</div>
    <div class="bd"><div class="sname">${a.name} · <span class="earn" style="font-size:14px">+$${a.pay.toFixed(2)}</span></div>
     <div class="saddr">${a.addr}</div>
     ${contactLine(a)}
     <div class="saddr" style="margin-top:3px">${a.info}</div>
     ${navLinks(a.addr)}
     ${contactLinks(a)}
     <div class="actions row">
      <button class="btn sm" data-aacc="${a.id}">Accept</button>
      <button class="btn alt sm" data-adec="${a.id}">Skip</button></div></div></div>`).join('')
  :`<div class="card"><div class="bd" style="color:var(--muted);font-size:13.5px">No open offers right now. New ones appear here — and on your dashboard — the moment a client books nearby.</div></div>`}
  ${S.addons.filter(a=>a.state!=='open').length?`<div class="label">Earlier today</div>
   <div class="card"><div class="bd">${S.addons.filter(a=>a.state!=='open').map(a=>
    `<div class="kv"><span class="k">${a.name}</span><span class="v">
      <span class="pill ${a.state==='accepted'?'acc':a.state==='declined'?'':'risk'}">${a.state}</span></span></div>`).join('')}
   </div></div>`:''}`);
 wireAddons();
}

/* ── 4 · EARNINGS ── */
function vEarn(){
 S.week[6][1]=S.earned;
 const max=Math.max(...S.week.map(w=>w[1]),1);
 const paid=S.stops.filter(s=>s.st==='done'&&s.pay);
 shell(`
  <div class="card"><div class="hd">Today</div><div class="bd">
   <div style="font-family:var(--mono);font-size:34px;font-weight:800;color:var(--acc)">$${S.earned.toFixed(2)}</div>
   <div style="font-size:12px;color:var(--muted);margin-top:4px">${paid.length} paid stops · route $${routePay().toFixed(2)} + add-ons</div>
   ${paid.map(s=>`<div class="kv"><span class="k">${s.name}${s.addon?' · add-on':''}</span><span class="v">+$${s.pay.toFixed(2)}</span></div>`).join('')||'<div class="kv"><span class="k">Nothing closed yet</span><span class="v">—</span></div>'}
  </div></div>
  <div class="card"><div class="hd">This week</div><div class="bd">
   <div class="bars">${S.week.map(([d,v],i)=>`<div><div class="b ${i===6?'hi':''}" style="height:${Math.max(6,90*v/max)}px"></div><div class="d">${d}</div></div>`).join('')}</div>
   <div class="kv" style="margin-top:8px"><span class="k">Week total</span><span class="v">$${S.week.reduce((a,w)=>a+w[1],0).toFixed(2)}</span></div>
   <div class="kv"><span class="k">Payout</span><span class="v">Fridays · direct deposit</span></div>
  </div></div>
  <div class="note acc"><div><b>Every dollar traces to a ledger entry.</b> A paid stop is a verified handover — code + signature, both mandatory — there is no other kind.</div></div>`);
}

/* ── 7 · PROFILE ── */
function vProfile(){
 const d=currentDriver();
 shell(`
  <div class="card"><div class="hd">${d.full} <div class="sp"></div><span class="pill acc">Owner-operator</span></div>
   <div class="bd">
    <div class="kv"><span class="k">Route</span><span class="v">${d.route}</span></div>
    <div class="kv"><span class="k">Vehicle</span><span class="v">${d.vehicle}</span></div>
    <div class="kv"><span class="k">Deliveries · 7 days</span><span class="v">184 · 100% on time</span></div>
    <div class="kv"><span class="k">Incidents · 90 days</span><span class="v">0</span></div>
    <div class="kv"><span class="k">Language</span><span class="v">Français / English</span></div>
   </div></div>
  <div class="card"><div class="hd">Compliance — all five stay green or the route locks</div><div class="bd">
   ${[['BSP licence · convoyage de biens de valeur','2028-04-11'],['Commercial vehicle insurance','2027-03-01'],
      ['Criminal record check','2026-02'],['CNESST 55090','Filed'],['Custody undertaking','v2 signed']]
     .map(r=>`<div class="kv"><span class="k">${r[0]}</span><span class="v"><span class="pill acc">${r[1]}</span></span></div>`).join('')}
  </div></div>
  <div class="card"><div class="hd">Preferences</div><div class="bd">
   <div class="kv"><span class="k">Navigation app</span><span class="v">Waze (default)</span></div>
   <div class="kv"><span class="k">Add-on offers</span><span class="v">On · within 8 min detour</span></div>
   <div class="kv"><span class="k">Off-route alert to dispatch</span><span class="v">
     <span class="seg">
      ${[1,2,5].map(k=>`<button data-thresh="${k}" class="${S.gps.thresholdKm===k?'on':''}">${k} km</button>`).join('')}
     </span></span></div>
   <div class="kv"><span class="k">Geofence on handovers</span><span class="v">${GEOFENCE_M} m · cannot be disabled</span></div>
   <div class="kv"><span class="k">Notifications</span><span class="v">Push + SMS</span></div>
  </div></div>
  <div class="note acc" style="margin-bottom:0"><div><b>Year 1: the two owners are the carrier.</b> No employees, no contractors — the first contractor triggers the legal opinion, budgeted for Year 2.</div></div>`,
  `<button class="btn alt" id="callDisp">Call dispatch · 24/7</button>
   <button class="btn ghost" id="signout">Sign out</button>`);
 wireProfile();
 $('#callDisp').onclick=()=>toast('Calling dispatch · 24/7');
 $('#signout').onclick=()=>{S.auth={logged:false,stage:'id',id:'',method:'',code:''};
  toast('Signed out');render();};
}

function wireProfile(){
 document.querySelectorAll('[data-thresh]').forEach(b=>b.onclick=()=>{
  S.gps.thresholdKm=+b.dataset.thresh;
  toast('Off-route alert set to '+S.gps.thresholdKm+' km — synced to dispatch');render();});
}
function render(){
 tickClock();
 if(S.gate==='splash')return vSplash();
 if(!S.auth.logged)return vLogin();
 $('#gate').style.display='none';
 $('#gate').innerHTML='';
 $('#app').style.display='flex';
 setChrome(false);
 if(S.tab==='dash')return vDash();
 if(S.tab==='route')return vRouteTab();
 if(S.tab==='addons')return vAddons();
 if(S.tab==='earn')return vEarn();
 return vProfile();
}
setInterval(tickClock,10000);
render();
</script>
</body></html>
