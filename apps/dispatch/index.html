<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0C1211">
<title>Dliverd — Dispatch</title>
<style>
:root{
  --paper:#F3F6F4;--surface:#FFFFFF;--raise:#FAFBFA;--sunk:#EDF1EF;
  --ink:#111917;--body:#2B3733;--muted:#65726E;--faint:#8B9793;
  --line:#DCE1DE;--line-mid:#C3CBC7;
  --acc:#0F6455;--acc-ink:#0B4E42;--acc-soft:#E3EFEB;--acc-line:#9FC9BE;
  --risk:#93301F;--risk-soft:#F8E9E5;--risk-line:#DFB6AC;
  --warn:#7C5A0E;--warn-soft:#F6EEDC;
  --dark:#0C1211;--dark2:#141C1A;--dkl:#31403C;--dkm:#8B9994;--dka:#54C1A6;--dka2:#7FD5BF;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1400px 700px at 50% -10%,#2a3a36 0%,#121816 55%,#0b100f 100%) fixed,#121816;
  color:var(--body);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;line-height:1.45;overflow:hidden}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,select{font-family:inherit;font-size:13.5px;color:var(--ink);border:1.5px solid var(--line-mid);
  border-radius:6px;padding:9px 10px;background:var(--surface);width:100%}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:1px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--mono)} .sp{flex:1 1 auto}
/* ── app frame on the dark stage ── */
.frame{display:flex;flex-direction:column;height:calc(100vh - 20px);margin:10px auto;max-width:1760px;
  min-width:0;border-radius:14px;overflow:hidden;position:relative;
  box-shadow:0 0 0 1px #2c3331,0 30px 90px rgba(0,0,0,.55)}
@media (min-width:1781px){.frame{width:1760px}}
@media (max-width:1780px){.frame{margin:10px}}
/* ── top bar ── */
.top{flex:0 0 auto;display:flex;align-items:center;gap:12px;background:var(--dark);color:#C0CCC7;
  padding:0 16px;height:56px;border-bottom:1px solid #1E2C29}
.top .mark{width:34px;height:34px;border-radius:8px;background:#0F6455;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brand{font-weight:800;font-size:14.5px;letter-spacing:.2em;color:#fff}
.sub{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--dkm)}
.demob{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
  border:1px solid var(--dkl);border-radius:7px;padding:8px 11px;color:var(--dkm);background:var(--dark2)}
.demob:hover{color:#C0CCC7;border-color:#465752}
.demob.on{border-color:var(--risk-line);color:#F0B4A6;background:#2C1A16}
.demob.sos{border-color:#5c2a1f;color:#E89B87}
.demob.sos:hover{background:#2C1A16;color:#F0B4A6}
.clock{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--dka2);letter-spacing:.04em;min-width:78px;text-align:right}
/* ── status strip ── */
.strip{flex:0 0 auto;display:flex;align-items:center;gap:20px;background:var(--dark2);color:var(--dkm);
  border-bottom:1px solid #1E2C29;padding:0 16px;height:38px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.06em;overflow-x:auto;white-space:nowrap}
.strip b{color:#EBF1EE;font-weight:700} .strip .acc{color:var(--dka2)} .strip .bad{color:#F0B4A6}
.strip .it{display:inline-flex;align-items:center;gap:7px}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--dka);animation:pulse 1.6s infinite;flex:0 0 auto}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
/* ── workspace grid ── */
.work{flex:1 1 auto;min-height:0;display:grid;background:var(--paper);position:relative;
  grid-template-columns:minmax(0,1fr) 430px;grid-template-rows:minmax(0,1.3fr) minmax(0,1fr);
  gap:12px;padding:12px}
#mapR{grid-column:1;grid-row:1;min-height:0}
#alertR{grid-column:1;grid-row:2;min-height:0}
#railR{grid-column:2;grid-row:1 / 3;min-height:0}
.card{background:var(--surface);border:1px solid var(--line-mid);border-radius:10px;overflow:hidden;
  display:flex;flex-direction:column;min-height:0}
.card .hd{display:flex;align-items:center;gap:9px;padding:10px 14px;background:var(--raise);flex:0 0 auto;
  border-bottom:1px solid var(--line);font-weight:800;color:var(--ink);font-size:13.5px}
.card .bd{padding:12px 14px;overflow-y:auto;flex:1 1 auto;min-height:0}
.hint{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:700}
#mapR .hd{flex-wrap:wrap;row-gap:6px}
.dchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;font-weight:700;
  letter-spacing:.03em;border:1px solid var(--line-mid);border-radius:14px;padding:5px 10px;color:var(--muted);background:var(--surface)}
.dchip b{color:var(--ink)}
.dchip.on{border-color:var(--acc);background:var(--acc-soft)}
.dchip.bad{border-color:var(--risk-line);background:var(--risk-soft)}
.dcd{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:pulse 1.6s infinite;flex:0 0 auto}
.dcd.bad{background:var(--risk)}
.pill{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 7px;border:1px solid var(--line-mid);border-radius:3px;
  color:var(--muted);background:var(--surface);white-space:nowrap}
.pill.acc{color:var(--acc-ink);border-color:var(--acc-line);background:var(--acc-soft)}
.pill.risk{color:var(--risk);border-color:var(--risk-line);background:var(--risk-soft)}
.pill.warn{color:var(--warn);border-color:#DDC386;background:var(--warn-soft)}
.note{display:flex;gap:9px;padding:10px 12px;font-size:12.5px;line-height:1.5;border-radius:8px;margin-bottom:10px}
.note.acc{background:var(--acc-soft);color:var(--acc-ink);border:1px solid var(--acc-line)}
.note.risk{background:var(--risk-soft);color:var(--risk);border:1px solid var(--risk-line)}
.note.warn{background:var(--warn-soft);color:var(--warn);border:1px solid #DDC386}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)} .kv .v{color:var(--ink);font-weight:700;text-align:right}
.label{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);margin:13px 2px 6px;font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:44px;border-radius:8px;background:var(--acc);color:#fff;font-size:14px;font-weight:800}
.btn:active{transform:scale(.99)}
.btn.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line-mid);font-weight:700}
.btn.danger{background:var(--surface);color:var(--risk);border:1.5px solid var(--risk-line);font-weight:700}
.btn.ghost{background:none;color:var(--muted);min-height:36px;font-weight:600;font-size:12.5px}
.btn.sm{min-height:36px;font-size:12.5px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
/* ── map ── */
.mapwrap{flex:1 1 auto;min-height:0;position:relative;background:#EDF1EF}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapchips{position:absolute;left:10px;top:10px;z-index:5;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.mapchips .dchip{box-shadow:0 2px 8px rgba(12,18,17,.08)}
.stopdot circle{stroke-width:3;cursor:pointer}
.stopdot.done circle{fill:#0F6455;stroke:#0F6455}
.stopdot.on circle{fill:#F3F6F4;stroke:#0F6455}
.stopdot.warn circle{fill:#F6EEDC;stroke:#7C5A0E;animation:stpulse 1.7s infinite}
.stopdot.offer circle{fill:#fff;stroke:#7C5A0E;stroke-dasharray:3.5 3;animation:stpulse 1.7s infinite}
.stopdot.exc circle{fill:#F8E9E5;stroke:#93301F}
@keyframes stpulse{0%,100%{stroke-width:3}50%{stroke-width:6}}
.stopdot text,.drv text,.maplab{font-family:var(--mono);font-weight:700;fill:#65726E;
  paint-order:stroke;stroke:#EDF1EF;stroke-width:3.5px;letter-spacing:.06em}
.stopdot text{font-size:9px}
.drv{cursor:pointer}
.drv .body{fill:#0C1211;stroke:#fff;stroke-width:2.5}
.drv .hd2{fill:#0F6455;stroke:#fff;stroke-width:1}
.drv text{font-size:10px;fill:#111917}
.drv.selr .body{stroke:#54C1A6;stroke-width:3.5}
.drv.mocked .body{animation:mockflash .8s infinite}
.drv.mocked .hd2{fill:#93301F}
@keyframes mockflash{0%,100%{fill:#0C1211;stroke:#fff}50%{fill:#93301F;stroke:#F8E9E5}}
.mockring{fill:none;stroke:#93301F;stroke-width:2;animation:ringout 1.2s infinite}
@keyframes ringout{0%{r:14;opacity:.9}100%{r:30;opacity:0}}
.offline1{stroke:#93301F;stroke-width:1.8;stroke-dasharray:5 4}
/* ── movement rail ── */
.mrow{display:grid;width:100%;text-align:left;grid-template-columns:86px 56px 1fr 44px auto;
  gap:3px 8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.mrow:hover{background:var(--raise)}
.mrow.sel{background:var(--acc-soft);box-shadow:inset 3px 0 0 var(--acc)}
.mrow.r{box-shadow:inset 3px 0 0 var(--risk)}
.mrow.r.sel{box-shadow:inset 3px 0 0 var(--risk);background:var(--risk-soft)}
.mrow .c1 b{display:block;font-family:var(--mono);font-size:12px;color:var(--ink)}
.mrow .c1 i{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.mrow .c2{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--muted)}
.mrow .c3 b{display:block;font-size:11.5px;color:var(--ink);font-weight:700}
.mrow .c3 i{display:block;font-style:normal;font-size:10.5px;color:var(--muted)}
.mrow .c4{font-family:var(--mono);font-size:12px;font-weight:800;text-align:right;color:var(--faint)}
.mrow .c4.bad{color:var(--risk)} .mrow .c4.good{color:var(--acc)}
.mrow .c6{grid-column:1 / -1;font-size:11px;color:var(--muted);line-height:1.4}
.mrow .c6 b{color:var(--risk)}
.breach{flex:0 0 auto;padding:8px 12px;background:var(--risk-soft);border-bottom:1px solid var(--risk-line);
  font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--risk);font-weight:700}
.breach b{font-weight:800}
.ghead{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--sunk);
  border-bottom:1px solid var(--line);font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  font-weight:800;color:var(--muted);position:sticky;top:0;z-index:2}
.ghead .gdot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.railbd{overflow-y:auto;flex:1 1 auto;min-height:0}
/* ── alert inbox ── */
.arow{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow.res{opacity:.55}
.adot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:0 0 auto;background:var(--warn)}
.arow.sev-risk .adot{background:var(--risk);animation:pulse 1.4s infinite}
.arow .atxt{flex:1 1 auto;font-size:12.5px;line-height:1.5;min-width:0}
.arow .atxt b{color:var(--ink)}
.arow .atag{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;font-weight:800;text-transform:uppercase;
  color:var(--faint);display:block;margin-bottom:2px}
.arow.sev-risk .atag{color:var(--risk)}
.arow.sev-warn .atag{color:var(--warn)}
.abtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.abtn{min-height:30px;padding:0 11px;border-radius:6px;font-size:11.5px;font-weight:800;
  background:var(--acc);color:#fff;display:inline-flex;align-items:center}
.abtn.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line-mid);font-weight:700}
.abtn.risk{background:var(--surface);color:var(--risk);border:1.5px solid var(--risk-line);font-weight:700}
/* ── detail drawer ── */
.drawer{position:absolute;top:12px;right:12px;bottom:12px;width:470px;max-width:calc(100% - 24px);z-index:40;
  background:var(--surface);border:1px solid var(--line-mid);border-radius:12px;
  box-shadow:-18px 0 50px rgba(12,18,17,.28);display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(calc(100% + 26px));transition:transform .28s cubic-bezier(.2,1,.3,1)}
.drawer.open{transform:none}
.drawer .dhd{display:flex;align-items:center;gap:9px;padding:13px 15px;background:var(--dark);color:#fff;flex:0 0 auto}
.drawer .dhd .ref{font-family:var(--mono);font-size:16px;font-weight:800}
.drawer .dhd .sub{color:var(--dkm)}
.xbtn{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  color:var(--dkm);border:1px solid var(--dkl);font-size:15px;font-weight:700;flex:0 0 auto}
.xbtn:hover{color:#fff}
.drawer .dbd{flex:1 1 auto;min-height:0;overflow-y:auto;padding:13px 15px 20px}
.prow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.prow:last-child{border-bottom:0}
.prow .pi{width:18px;height:18px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;background:var(--acc-soft);color:var(--acc-ink)}
.prow.pend .pi{background:var(--sunk);color:var(--faint)}
.prow .pk{color:var(--ink);font-weight:700} .prow .pv{margin-left:auto;color:var(--muted);text-align:right}
.ledger{background:var(--dark);border-radius:9px;padding:11px 13px;font-family:var(--mono);font-size:10.5px;
  color:var(--dkm);line-height:1.8;overflow-x:auto}
.ledger b{color:var(--dka2);font-weight:700} .ledger .h{color:#6D7B76}
.ledger .head{color:#EBF1EE}
.actgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1.5px solid var(--line-mid);
  border-radius:8px;padding:9px 11px;background:var(--surface);text-align:left}
.actb:hover{background:var(--raise)}
.actb b{font-size:12.5px;color:var(--ink)} .actb i{font-style:normal;font-size:10px;color:var(--muted);line-height:1.35}
.actb[disabled]{opacity:.45;cursor:not-allowed}
.actb[disabled]:hover{background:var(--surface)}
.actb.warn{border-color:#DDC386} .actb.warn b{color:var(--warn)}
.actb.risk{border-color:var(--risk-line)} .actb.risk b{color:var(--risk)}
/* ── dialog ── */
.dlgwrap{position:fixed;inset:0;z-index:80;background:rgba(12,18,17,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{width:520px;max-width:100%;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:12px;
  border:1px solid var(--line-mid);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.dlg .dh{padding:14px 16px;background:var(--raise);border-bottom:1px solid var(--line);font-weight:800;font-size:15px;color:var(--ink)}
.dlg .db{padding:14px 16px}
.dlg .chainline{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--faint);
  background:var(--sunk);border-radius:6px;padding:8px 10px;margin-top:12px;line-height:1.6}
.dlg .row2{display:flex;gap:8px;margin-top:14px}
.chkrow{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--body);margin-top:11px;line-height:1.45}
.chkrow input{width:17px;height:17px;flex:0 0 auto;margin-top:1px}
.codebox{font-family:var(--mono);font-size:30px;font-weight:800;letter-spacing:.28em;color:var(--acc-ink);
  background:var(--acc-soft);border:1px solid var(--acc-line);border-radius:9px;text-align:center;padding:15px 0;margin:12px 0 4px}
/* ── SOS full takeover ── */
.soswrap{position:fixed;inset:0;z-index:120;background:var(--risk);color:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:30px;animation:sosin .25s}
@keyframes sosin{0%{opacity:0}100%{opacity:1}}
.soswrap::before{content:'';position:absolute;inset:0;background:#6E2114;animation:sosflash 1s infinite;pointer-events:none}
@keyframes sosflash{0%,100%{opacity:0}50%{opacity:.55}}
.sosin{position:relative;max-width:640px;width:100%}
.sosin .eyeb{font-family:var(--mono);font-size:12px;letter-spacing:.35em;font-weight:800}
.sosin h1{font-size:64px;font-weight:800;letter-spacing:.1em;margin:8px 0 4px}
.sosin .who{font-size:22px;font-weight:800}
.sosin .meta{font-family:var(--mono);font-size:12.5px;line-height:2;opacity:.92;margin-top:14px}
.sosin .meta b{font-weight:800}
.sosbtns{display:flex;gap:10px;margin-top:26px}
.sosbtns .b1{flex:1.4 1 0;min-height:62px;border-radius:10px;background:#fff;color:var(--risk);font-size:18px;font-weight:800}
.sosbtns .b2{flex:1 1 0;min-height:62px;border-radius:10px;border:2px solid rgba(255,255,255,.75);font-size:15px;font-weight:800;color:#fff}
.sosack{font-family:var(--mono);font-size:12px;margin-top:18px;background:rgba(0,0,0,.28);border-radius:8px;padding:11px 14px;line-height:1.7}
/* ── toast ── */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120%);
  background:var(--ink);color:#EBF1EE;font-size:13px;font-weight:700;padding:11px 17px;
  border-radius:8px;transition:transform .25s,opacity .25s;z-index:140;max-width:640px;text-align:center;
  opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
/* ── stacking below 800px ── */
@media (max-width:800px){
  body{overflow:auto}
  .frame{height:auto;min-height:calc(100vh - 20px)}
  .work{grid-template-columns:1fr;grid-template-rows:none}
  #mapR{grid-column:1;grid-row:auto;height:380px}
  #alertR{grid-column:1;grid-row:auto;max-height:440px}
  #railR{grid-column:1;grid-row:auto;max-height:560px}
  .drawer{position:fixed;top:10px;right:10px;bottom:10px}
  .top{flex-wrap:wrap;height:auto;padding:10px 14px;row-gap:8px}
}
.sealimg{width:24px;height:24px;border-radius:5px;display:block}.mark>.sealimg{width:100%;height:100%;border-radius:inherit}
</style></head><body>

/* ── grouping: sorted by time-to-breach, never by creation ── */
const GRPS=[['RISK','AT RISK','#93301F'],['LATE','LATE','#93301F'],['CUSTODY','IN CUSTODY','#0F6455'],
 ['OFFER','OFFERED — UNASSIGNED','#7C5A0E'],['ONTIME','ON TIME','#9FC9BE'],['DONE','DONE','#C3CBC7']];
function groupOf(m){
 if(m.status==='DELIVERED')return'DONE';
 if(m.status==='OFFERED')return'OFFER';
 if(m.status==='EXCEPTION'||m.risk)return'RISK';
 if(m.pMin&&nowMin()>m.pMin)return'LATE';
 if(m.status==='PICKED_UP')return'CUSTODY';
 return'ONTIME';
}
const ttb=m=>m.pMin?Math.round(m.pMin-nowMin()):9999;
function statusPill(m,g){
 if(m.held)return'<span class="pill warn">HELD</span>';
 if(m.status==='EXCEPTION')return'<span class="pill risk">EXCEPTION</span>';
 if(g==='RISK')return'<span class="pill risk">AT RISK</span>';
 if(g==='LATE')return'<span class="pill risk">LATE</span>';
 if(m.status==='DELIVERED')return'<span class="pill acc">DELIVERED</span>';
 if(m.status==='OFFERED')return'<span class="pill warn">OFFERED</span>';
 if(m.status==='PICKED_UP')return'<span class="pill acc">IN CUSTODY</span>';
 return'<span class="pill">ASSIGNED</span>';
}

function driftTxt(m){
 if(m.status==='DELIVERED')return'✓';
 if(m.status==='OFFERED')return'—';
 return m.drift>0?'+'+m.drift:m.drift<0?'−'+(-m.drift):'±0';
}
function mrow(m){
 const g=groupOf(m), t=ttb(m);
 const risky=g==='RISK'||g==='LATE';
 const timeline=m.status==='DELIVERED'?'':(m.status==='OFFERED'
  ?(S.offer.state==='open'?` · <span class="mono" data-count>0:${String(Math.max(0,S.offer.left)).padStart(2,'0')}</span> left on the offer`
    :' · <span class="mono">OFFER_TIMEOUT passed</span>')
  :(t<0?` · <span class="mono">${-t} min past</span> the promise`
    :` · <span class="mono">T−${t} min</span> to the promise`));
 return `<button class="mrow ${S.sel===m.ref?'sel':''} ${risky?'r':''}" data-mv="${m.ref}">
  <span class="c1"><b>${m.ref}</b><i>${m.ticket}</i></span>
  <span class="c2">${m.drv||'— ·'}</span>
  <span class="c3"><b>${m.win}</b><i>ETA ${m.eta}</i></span>
  <span class="c4 ${m.drift>0?'bad':m.drift<0?'good':''}">${driftTxt(m)}</span>
  ${statusPill(m,g)}
  <span class="c6">${m.rcpt}${m.note?' — '+m.note:''}${timeline}</span>
 </button>`;
}
function nextBreach(){
 const open=S.movements.filter(m=>m.status!=='DELIVERED'&&m.status!=='EXCEPTION'&&m.pMin);
 if(!open.length)return'';
 const m=open.reduce((a,b)=>ttb(a)<=ttb(b)?a:b), t=ttb(m);
 return t<0
  ?`<b>${m.ref}</b> is <b>${-t} min past</b> its promise (${m.win})`
  :`<b>${m.ref}</b> breaches in <b>${t} min</b> (${m.win})`;
}
function vRail(){
 const byG={};S.movements.forEach(m=>{const g=groupOf(m);(byG[g]=byG[g]||[]).push(m);});
 Object.values(byG).forEach(a=>a.sort((x,y)=>ttb(x)-ttb(y)));
 $('#railR').innerHTML=`
  <div class="hd">MOVEMENTS <span class="pill">${S.movements.length}</span>
   <div class="sp"></div><span class="hint">sorted by time-to-breach · not by creation</span></div>
  <div class="breach">WHAT BREAKS NEXT · ${nextBreach()}</div>
  <div class="railbd">${GRPS.map(([k,lbl,col])=>{
   const rows=byG[k]||[];if(!rows.length)return'';
   return `<div class="ghead"><span class="gdot" style="background:${col}"></span>${lbl} · ${rows.length}</div>
    ${rows.map(mrow).join('')}`;}).join('')}
  <div style="padding:10px 12px"><span class="hint">DEMO · click any row — full picture + the 6 dispatcher actions</span></div>
  </div>`;
}
