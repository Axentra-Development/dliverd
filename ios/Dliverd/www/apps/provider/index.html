<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Dliverd Provider</title>
<style>
:root{
  --paper:#F3F6F4;--surface:#FFFFFF;--raise:#FAFBFA;--sunk:#EDF1EF;
  --ink:#111917;--body:#2B3733;--muted:#65726E;--faint:#8B9793;
  --line:#DCE1DE;--line-mid:#C3CBC7;
  --acc:#0F6455;--acc-ink:#0B4E42;--acc-soft:#E3EFEB;--acc-line:#9FC9BE;
  --risk:#93301F;--risk-soft:#F8E9E5;--risk-line:#DFB6AC;
  --warn:#7C5A0E;--warn-soft:#F6EEDC;
  --dark:#0C1211;--dark2:#141C1A;--dkl:#31403C;--dkm:#8B9994;--dka:#54C1A6;--dka2:#7FD5BF;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1a2220}
body{margin:0;color:var(--body);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;line-height:1.45}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 16px;
  background:radial-gradient(1200px 600px at 50% -10%,#2a3a36 0%,#121816 55%,#0b100f 100%)}
.phone{width:390px;height:844px;background:#000;border-radius:54px;padding:11px;position:relative;
  box-shadow:0 0 0 1px #2c3331,0 28px 80px rgba(0,0,0,.55),inset 0 0 0 1px #3d4542}
.phone-screen{height:100%;background:var(--paper);border-radius:44px;overflow:hidden;position:relative;
  display:flex;flex-direction:column}
.island{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:118px;height:34px;
  background:#0a0d0c;border-radius:20px;z-index:40;pointer-events:none}
.osbar{position:absolute;top:0;left:0;right:0;height:54px;z-index:30;display:flex;align-items:flex-end;
  justify-content:space-between;padding:0 28px 10px;color:#111;font-size:14px;font-weight:700;
  pointer-events:none}
.osbar.light{color:#EBF1EE}
.osbar .sig{display:flex;align-items:center;gap:5px}
.osbar svg{display:block}
.homeind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:128px;height:5px;
  background:#111;border-radius:4px;opacity:.28;z-index:30;pointer-events:none}
.homeind.on-dark{background:#fff;opacity:.45}
#app,#gate{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#gate{background:var(--dark);color:#C0CCC7}
@media (max-width:480px){
  .stage{padding:0;background:#000;min-height:100dvh}
  .phone{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none}
  .phone-screen{border-radius:0}
}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,select{font-family:inherit;font-size:15px;color:var(--ink);border:1.5px solid var(--line-mid);
  border-radius:6px;padding:12px;background:var(--surface);width:100%}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:1px}
.mono{font-family:var(--mono)}
.sp{flex:1 1 auto}
.bar{flex:0 0 auto;z-index:10;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line-mid);padding-top:54px}
.bar .r1{display:flex;align-items:center;gap:10px;padding:8px 15px 10px}
.brand{font-weight:800;font-size:13.5px;letter-spacing:.16em;color:var(--ink)}
.sub{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 16px}
.card{background:var(--surface);border:1px solid var(--line-mid);border-radius:10px;
  margin-bottom:12px;overflow:hidden}
.card .hd{display:flex;align-items:center;gap:9px;padding:12px 15px;background:var(--raise);
  border-bottom:1px solid var(--line);font-weight:800;color:var(--ink);font-size:14px}
.card .bd{padding:13px 15px}
.pill{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 7px;border:1px solid var(--line-mid);border-radius:3px;
  color:var(--muted);background:var(--surface);white-space:nowrap}
.pill.acc{color:var(--acc-ink);border-color:var(--acc-line);background:var(--acc-soft)}
.pill.risk{color:var(--risk);border-color:var(--risk-line);background:var(--risk-soft)}
.pill.warn{color:var(--warn);border-color:#DDC386;background:var(--warn-soft)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:50px;border-radius:8px;background:var(--acc);color:#fff;font-size:15.5px;font-weight:800}
.btn:active{transform:scale(.99)}
.btn.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line-mid);font-weight:700}
.btn.danger{background:var(--surface);color:var(--risk);border:1.5px solid var(--risk-line);font-weight:700}
.btn.ghost{background:none;color:var(--muted);min-height:40px;font-weight:600;font-size:13px}
.btn.sm{min-height:40px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.45;pointer-events:none}
.note{display:flex;gap:9px;padding:11px 13px;font-size:12.5px;line-height:1.5;border-radius:8px;margin-bottom:12px}
.note.acc{background:var(--acc-soft);color:var(--acc-ink);border:1px solid var(--acc-line)}
.note.risk{background:var(--risk-soft);color:var(--risk);border:1px solid var(--risk-line)}
.note.warn{background:var(--warn-soft);color:var(--warn);border:1px solid #DDC386}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)} .kv .v{color:var(--ink);font-weight:700;text-align:right}
.label{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);margin:14px 2px 7px}
.hero{background:var(--dark);border-radius:12px;color:#C0CCC7;padding:16px;margin-bottom:12px}
.hero .eyeb{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--dka)}
.hero h2{color:#fff;font-size:18px;font-weight:800;margin-top:6px;line-height:1.25}
.hero .m{font-size:12px;color:var(--dkm);margin-top:4px}
.hero .row{display:flex;gap:8px;margin-top:13px}
.hero .b1{flex:1 1 auto;min-height:44px;border-radius:7px;background:var(--dka);color:var(--dark);
  font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:7px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line-mid);border-radius:10px;padding:13px 14px}
.tile .v{font-family:var(--mono);font-size:23px;font-weight:800;color:var(--ink);line-height:1}
.tile .v.acc{color:var(--acc)} .tile .v.risk{color:var(--risk)}
.tile .k{font-size:10.5px;color:var(--muted);margin-top:5px}
/* wizard */
.wstep{background:var(--surface);border:1px solid var(--line-mid);border-radius:10px;margin-bottom:10px;overflow:hidden}
.whead{display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%;text-align:left;background:var(--raise)}
.wnum{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-mid);display:flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--muted);flex:0 0 auto;
  background:var(--surface)}
.wstep.done .wnum{background:var(--acc);border-color:var(--acc);color:#fff}
.wstep.cur .wnum{border-color:var(--acc);color:var(--acc-ink);box-shadow:0 0 0 4px var(--acc-soft)}
.wstep.lockd .wnum{border-color:var(--line);color:var(--faint)}
.wtitle{font-weight:800;font-size:13.5px;color:var(--ink)}
.wstep.lockd .wtitle{color:var(--faint)}
.wsum{font-size:10.5px;color:var(--muted);margin-top:1px;line-height:1.3}
.wbody{padding:13px 14px;border-top:1px solid var(--line)}
/* reconciliation */
.rrow{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rst{font-family:var(--mono);font-size:8.5px;letter-spacing:.04em;padding:3px 0;border-radius:3px;border:1px solid;
  flex:0 0 auto;width:56px;text-align:center;font-weight:700}
.st-hit{color:var(--acc-ink);border-color:var(--acc-line);background:var(--acc-soft)}
.st-miss,.st-short{color:var(--risk);border-color:var(--risk-line);background:var(--risk-soft)}
.st-over,.st-extra{color:var(--warn);border-color:#DDC386;background:var(--warn-soft)}
.st-pend{color:var(--muted);border-color:var(--line-mid);background:var(--sunk)}
.rname{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.25}
.rmeta{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:2px}
.rqty{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:800;color:var(--ink);flex:0 0 auto}
.rqty small{font-size:10px;color:var(--muted);font-weight:600}
.scanbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.scanbtns button{border:1.5px solid var(--line-mid);border-radius:8px;background:var(--surface);
  padding:9px 10px;text-align:left;font-size:11px;font-weight:700;color:var(--ink);line-height:1.3}
.scanbtns button:active{background:var(--raise)}
.scanbtns .c{display:block;font-family:var(--mono);font-size:8.5px;color:var(--faint);margin-top:2px}
.scanview{background:var(--dark);border-radius:10px;overflow:hidden;margin-bottom:10px}
/* address */
.addrbox{border:1.5px solid var(--line-mid);border-radius:8px;padding:10px 12px;margin-top:8px;
  font-size:13px;line-height:1.5;background:var(--surface)}
.addrbox.ok{border-color:var(--acc-line);background:var(--acc-soft)}
.addrbox .t{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin-bottom:3px}
.strike{text-decoration:line-through;color:var(--faint)}
/* handover / big code */
.hand{background:var(--dark);color:#C0CCC7;border-radius:12px;padding:18px 16px;margin-bottom:12px}
.hand h2{font-size:18px;font-weight:800;color:#fff;line-height:1.25}
.hand .sb{font-size:12px;color:var(--dkm);margin-top:5px;line-height:1.5}
.bigcode{font-family:var(--mono);font-size:46px;font-weight:800;letter-spacing:.14em;color:#fff;
  text-align:center;padding:14px 0 4px;user-select:all;-webkit-user-select:all}
.hmeta{display:flex;justify-content:space-between;margin-top:10px;font-family:var(--mono);
  font-size:10px;color:#6D7B76}
.hmeta b{color:var(--dka)}
.otp{display:flex;gap:7px;justify-content:center;margin-top:16px}
.otp span{width:40px;height:50px;border:1px solid var(--dkl);border-radius:6px;background:var(--dark2);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:22px;
  font-weight:700;color:#EBF1EE}
.otp span.f{border-color:var(--dka);background:#12302A}
.otp.err span{border-color:#A63A26;background:#2C1A16}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pad button{height:50px;border-radius:8px;background:var(--dark2);border:1px solid var(--dkl);
  color:#EBF1EE;font-family:var(--mono);font-size:20px}
.pad button:active{background:#1E2C29}
.pad .fn{font-size:11px;color:var(--dkm)}
.sighint{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:#6D7B76;text-align:center;padding:6px 0 8px}
.lockcard{background:var(--risk-soft);border:1.5px solid var(--risk-line);border-radius:10px;
  padding:18px 16px;text-align:center;margin-bottom:12px}
.lockcard .big{font-size:34px}
.lockcard h3{color:var(--risk);font-size:16px;margin-top:6px}
.lockcard p{font-size:12.5px;color:var(--risk);margin-top:6px;line-height:1.5}
/* box rows */
.boxrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.boxrow:last-child{border-bottom:0}
.boxrow .bid{font-family:var(--mono);font-size:13px;font-weight:800;color:var(--ink)}
.boxrow .bfor{font-size:11px;color:var(--muted);margin-top:1px}
/* label preview */
.labelprev{background:#fff;border:1.5px solid var(--line-mid);border-radius:10px;overflow:hidden;
  box-shadow:0 10px 26px rgba(17,25,23,.14);margin-bottom:10px}
.labelprev.void{opacity:.5;position:relative}
.lband{background:var(--dark);color:#fff;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  font-weight:700;padding:9px 12px;display:flex;justify-content:space-between;align-items:center}
.lbody{padding:12px 14px}
.lname{font-size:17px;font-weight:800;color:#111;display:flex;align-items:center;gap:8px}
.laddr{font-size:13px;color:#222;margin-top:3px;line-height:1.45}
.lmeta{font-size:11px;color:#555;margin-top:5px}
.lfrom{font-family:var(--mono);font-size:8.5px;color:#777;margin-top:9px;letter-spacing:.05em;text-transform:uppercase}
.lreseal{margin-top:9px;border:1.5px solid #93301F;color:#93301F;font-size:11.5px;font-weight:700;
  padding:7px 9px;border-radius:6px;line-height:1.4}
.lbc{margin-top:10px}
.lref{font-family:var(--mono);font-size:15px;font-weight:800;letter-spacing:.3em;text-align:center;color:#111;margin-top:2px}
/* ledger */
.ledrow{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.ledrow:last-child{border-bottom:0}
.ledrow .lt{font-family:var(--mono);font-size:9.5px;color:var(--faint);width:58px;flex:0 0 auto}
.ledrow .le{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--acc-ink);white-space:nowrap}
.ledrow .lr{color:var(--muted);font-size:11px;line-height:1.35}
.ledrow .lh{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--faint);flex:0 0 auto}
.rangebar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:8px;
  border:1px solid var(--line)}
.rangebar i{display:block;height:100%;background:var(--acc);border-radius:4px;min-width:6px}
/* nav / toast */
.nav{flex:0 0 auto;z-index:10;display:flex;background:rgba(255,255,255,.9);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line-mid);padding:7px 0 22px}
.nav button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--faint);font-size:9px;font-weight:700;padding:4px 0;position:relative}
.nav button.on{color:var(--acc)}
.nav svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-2px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;
  background:var(--risk);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;
  justify-content:center;padding:0 4px}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%) translateY(120%);
  background:var(--ink);color:#EBF1EE;font-size:13px;font-weight:700;padding:11px 17px;
  border-radius:8px;transition:transform .25s,opacity .25s;z-index:60;max-width:86%;text-align:center;
  opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* splash / role picker */
.splash{height:100%;display:flex;flex-direction:column;align-items:center;padding:88px 28px 36px;text-align:center}
.splash .mark{width:76px;height:76px;border-radius:18px;background:#0F6455;display:flex;
  align-items:center;justify-content:center;margin-bottom:18px}
.splash .mark svg{width:42px;height:20px}
.splash h1{color:#fff;font-size:28px;letter-spacing:.18em;font-weight:800}
.splash p{color:var(--dkm);margin-top:8px;font-size:13px}
.roles{height:100%;overflow-y:auto;padding:80px 22px 40px}
.roles .mark{width:56px;height:56px;border-radius:14px;background:#0F6455;display:flex;
  align-items:center;justify-content:center;margin-bottom:14px}
.roles .mark svg{width:32px;height:16px}
.roles h1{color:#fff;font-size:21px;letter-spacing:.14em;font-weight:800}
.roles .st{color:var(--dkm);font-size:12px;margin-top:6px;line-height:1.5}
.rolecard{display:block;width:100%;text-align:left;background:var(--dark2);border:1.5px solid var(--dkl);
  border-radius:14px;padding:16px;margin-top:12px;color:#EBF1EE}
.rolecard:active{background:#1E2C29}
.rolecard .rt{font-size:16px;font-weight:800;color:#fff}
.rolecard .rn{font-size:12.5px;color:var(--dka2);margin-top:3px;font-weight:600}
.rolecard .rd{font-size:11px;color:var(--dkm);margin-top:7px;line-height:1.55}
/* sheets & modals */
.sheet{position:absolute;inset:0;background:rgba(12,18,17,.45);z-index:50;display:flex;align-items:flex-end}
.sheet.center{align-items:center;padding:16px}
.sheet .panel{width:100%;background:var(--surface);border-radius:16px 16px 0 0;padding:16px 16px 32px}
.sheet.center .panel{border-radius:14px;padding:16px;max-height:88%;overflow-y:auto}
.sheet .panel h3{font-size:16px;color:var(--ink)}
.sheet .opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sheet .opts button{min-height:46px;border-radius:10px;border:1.5px solid var(--line-mid);

.field{margin-top:10px}
.field .fl{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin-bottom:4px}
@keyframes slidein{0%{transform:translateY(-14px);opacity:0}100%{transform:none;opacity:1}}
.appear{animation:slidein .3s}
.sealimg{width:24px;height:24px;border-radius:5px;display:block}.mark>.sealimg{width:100%;height:100%;border-radius:inherit}
.mark{background:none!important}

<script>

const D=()=>S.desk;
const declared=()=>D().lines.reduce((a,l)=>a+l.got*l.unit,0);
function lstat(l){
 if(!D().ticket)return l.got>0?'PENDING':'—';
 if(l.expected){if(l.got===0)return 'MISSING';if(l.got<l.want)return 'SHORT';if(l.got>l.want)return 'OVER';return 'HIT';}
 return 'EXTRA';
}
const discrepant=()=>D().ticket&&D().lines.some(l=>['MISSING','SHORT','OVER','EXTRA'].includes(lstat(l)));
function attachTicket(){
 const d=D();d.ticket=true;
 for(const e of EXPECTED){
  let l=d.lines.find(x=>x.code===e.code);
  if(!l){l={code:e.code,name:e.name,ser:e.ser,unit:e.unit,got:0,imeis:[],expected:true,want:e.want,type:e.type};d.lines.push(l);}
  else{l.expected=true;l.want=e.want;l.name=e.name;l.unit=e.unit;l.type=e.type;}
 }
 d.lines.sort((a,b)=>(b.expected?1:0)-(a.expected?1:0));
 if(d.packFirst&&d.lines.some(l=>l.got>0)){
  const hit=d.lines.filter(l=>l.expected&&l.got>0).length,
        miss=d.lines.filter(l=>l.expected&&l.got===0).length,
        unexp=d.lines.filter(l=>!l.expected).length;
  d.banner=`Match run at attach — ${hit} matched, ${miss} missing, ${unexp} unexpected.`;
 }
 chain('ticket.attached',d.ticketRef+' · '+TICKET.rec+' · '+d.boxRef);
 d.step=d.packFirst?2:2;
 toast(d.ticketRef+' fetched — Léa Fortin · tracking link, code and receipt unlocked');
 render();
}
function doScan(code,name,unit,ser,imei){
 const d=D();
 if(d.sealed)return toast('REFUSED — manifest locked, '+d.boxRef+' is sealed. Unseal to change it.',true);
 let l=d.lines.find(x=>x.code===code);
 if(ser){
  if(l&&l.imeis.includes(imei))return toast('REFUSED — IMEI …'+imei.slice(-4)+' is already in this box (duplicate serialized)',true);
  if(!l){l={code,name,ser:true,unit,got:0,imeis:[],expected:false,want:0,type:'Serialized · IMEI'};d.lines.push(l);}
  l.imeis.push(imei);l.got++;
  toast(name+' · IMEI …'+imei.slice(-4)+' ✓ in '+d.boxRef);
 }else{
  if(!l){l={code,name,ser:false,unit,got:1,imeis:[],expected:false,want:0,type:'SKU'};d.lines.push(l);
   toast(name+' ✓ in '+d.boxRef);}
  else{l.got++;} /* duplicate SKU → quantity increments silently, no warning */
 }
 render();
}
function wedgeHandle(v){
 v=v.trim();if(!v)return;
 if(v===IMEI_1)return doScan('APL16P256','iPhone 16 Pro 256 · Natural',144900,true,IMEI_1);

 if(v.toUpperCase()==='MG25W-CA')return doScan('MG25W-CA','MagSafe 25W charger',6500,false);

function stepState(n){
 const d=D();
 if(n===1)return d.ticket?'done':'open';
 if(n===2)return d.lines.some(l=>l.got>0)?'done':'open';
 if(n===3)return d.addr.confirmed?'done':(d.ticket?'open':'lockd');
 if(n===4)return d.sealed?'done':(d.addr.confirmed?'open':'lockd');
 if(n===5)return d.booked?'done':(d.sealed?'open':'lockd');
 return 'open';
}
function stepSum(n){
 const d=D();
 if(n===1)return d.ticket?d.ticketRef+' · '+TICKET.rec+' · FR ✓':'Scan or type the work-order ref — ticket-first is preferred';
 if(n===2){const c=d.lines.reduce((a,l)=>a+l.got,0);
  return c?c+' item'+(c>1?'s':'')+' scanned · declared '+money(declared())+(discrepant()?' · DISCREPANCY':''):'Live reconciliation against the ticket';}
 if(n===3)return d.addr.confirmed?d.addr.ship.line1+', '+d.addr.ship.city+' — confirmed ✓':(d.ticket?'Confirm where this box is going':'Locked — the address comes from the ticket (step 1)');

 if(n===5)return d.booked?d.mv+' · '+SVC.find(s=>s.id===d.svc).n+' · booked':(d.sealed?'Pick the service, book, print':'Locked — seal the box in step 4 first');

function wireModal(wrap,m){
 const q=s=>wrap.querySelector(s);
 if(m.type==='unknown'){
  q('#ukPhoto').onclick=()=>{q('#ukPhoto').textContent='📷 Photo attached ✓';toast('Photo attached to the capture');};
  q('#ukCancel').onclick=closeModal;
  q('#ukSave').onclick=()=>{
   const code=q('#ukCode').value.trim()||'UNKNOWN',desc=q('#ukDesc').value.trim()||'Unlabelled item',
    val=Math.round(parseFloat(q('#ukVal').value||'0')*100)||0;
   D().lines.push({code,name:desc,ser:false,unit:val,got:1,imeis:[],expected:false,want:0,type:'Captured · unknown'});
   S.modal=null;toast(desc+' captured as EXTRA — the match will flag it');render();};
 }
 if(m.type==='addr'){
  const A=D().addr;
  const material=()=>q('#adL1').value!==A.fetched.line1||q('#adCity').value!==A.fetched.city||q('#adPc').value!==A.fetched.postal;
  const refresh=()=>{
   const mat=material();
   q('#adReasonWrap').style.display=mat?'':'none';
   q('#adApproval').style.display=(mat&&q('#adOver2k').value)?'':'none';};
  ['adL1','adUnit','adPc','adCity','adNote'].forEach(id=>q('#'+id).addEventListener('input',refresh));
  refresh();
  let mgrOk=false;
  if(q('#adAskMgr'))q('#adAskMgr').onclick=()=>{mgrOk=true;q('#adApproved').style.display='';
   toast('Chantal approved the material change — chained manager.approved');};
  q('#adCancel').onclick=closeModal;
  q('#adSave').onclick=()=>{
   const mat=material();
   const vals={line1:q('#adL1').value.trim(),unit:q('#adUnit').value.trim(),city:q('#adCity').value.trim(),
    postal:q('#adPc').value.trim(),note:q('#adNote').value.trim()};
   const changed=Object.keys(vals).some(k=>vals[k]!==A.ship[k]);
   if(!changed){S.modal=null;return render();}
   if(mat){
    const r=q('#adReason').value;
    if(!r)return toast('A material change needs a reason from the list — save stays blocked',true);
    if(q('#adOver2k').value&&S.role==='REP'&&!mgrOk)return toast("Over $2,000 — Chantal's approval is required before save",true);
    A.reason=r;A.overridden=true;
    A.approvedBy=q('#adOver2k').value?(S.role==='REP'?'Chantal G.':U().short+' (self, STORE_MANAGER)'):'';
    chain('address.overridden',D().boxRef+' · '+ (vals.line1!==A.fetched.line1?'line1':vals.city!==A.fetched.city?'city':'postal')+' · '+r+' · '+U().short+(A.approvedBy?' · approved: '+A.approvedBy:''));
    if(S.role==='REP')S.queue.push({mv:D().mv||'—',box:D().boxRef,who:U().short,at:tNow(),field:'material',
     from:A.fetched.line1,to:vals.line1,reason:r});
   }else{A.corrected=true;chain('address.corrected',D().boxRef+' · unit/note · free · '+U().short);}
   A.ship=vals;
   const wasConfirmed=A.confirmed;
   if(wasConfirmed){A.confirmed=false;chain('address.unconfirmed',D().boxRef+' · edit after confirmation');}
   S.modal=null;
   toast(wasConfirmed?'Saved — the confirmation was cleared; confirm the address again before sealing'
    :(mat?'Material override saved — chained and reviewable':'Correction saved — unit/note are free'));
   render();};
 }
 if(m.type==='unseal'){
  const u=S.unseal,d=D();
  if(q('#usCancel'))q('#usCancel').onclick=closeModal;
  if(u.stage===1){
   q('#usReason').onchange=e=>{u.reason=e.target.value;};
   q('#usNext').onclick=()=>{
    if(!u.reason)return toast('Pick a reason — the closed list is the point',true);
    u.stage=2;render();};
  }else{

   S.modal=null;

function doUnseal(){
 const d=D(),u=S.unseal;
 const last=d.sealHist[d.sealHist.length-1];
 if(last)last.st='VOIDED — '+u.reason.toLowerCase();
 chain('seal.voided',d.boxRef+' · '+d.seal+' · '+u.reason+' · 2nd code: '+(S.role==='REP'?'Chantal G.':'dispatch'));
 if(d.booked){d.mvSt='RECALLED';d.booked=false;
  chain('movement.recalled',d.mv+' · unseal after booking · quote $4.50');}
 if(d.printed){d.labelVoid=true;chain('label.voided',d.boxRef+' · unseal voids the print');}
 d.printed=0;d.sealed=false;d.resealed++;d.fails=0;
 S.modal=null;d.step=4;
 toast(d.seal+' VOIDED — '+d.boxRef+' is OPEN again · seal count now '+(d.sealHist.length+1)+' · it will show on the receipt');
 render();
}

     <div class="kv"><span class="k">Ticket</span><span class="v mono">${b.ticket}</span></div>
     <div class="kv"><span class="k">Service</span><span class="v">${b.svc}${b.win!=='—'?' · '+b.win:''}</span></div>
     <div class="kv"><span class="k">Recipient</span><span class="v">${b.rec} <span class="pill acc">${b.lang}</span></span></div>
     <div class="kv"><span class="k">Address</span><span class="v" style="font-weight:600">${b.addr}</span></div>
     <div class="kv"><span class="k">Booked by</span><span class="v">${b.by}${b.by===U().short?' (you)':''}</span></div>
     ${b.note?`<div class="kv"><span class="k">Routing</span><span class="v" style="font-weight:600">${b.note}</span></div>`:''}
    </div></div>
   <div class="card"><div class="hd">Manifest — shipper-attested</div><div class="bd">
    ${b.items.map(i=>`<div class="kv"><span class="k">${i.n}<br><span class="mono" style="font-size:10px">${i.id}</span></span><span class="v">${money(i.v)}</span></div>`).join('')}
    <div class="kv"><span class="k">Declared total</span><span class="v">${money(b.declared)}</span></div>
   </div></div>
   <div class="note acc"><div><b>Declared value is never printed on the label.</b> Shipper-attested contents,
    seal-verified custody — DLIVERD never opens a box.</div></div>
   <div class="card"><div class="hd">Seal history</div><div class="bd">
    ${b.hist.map(h=>`<div class="kv"><span class="k mono">${h.s}</span><span class="v" style="font-weight:600">${h.st} · ${h.at} · ${h.by}</span></div>`).join('')}
    ${b.resealed?`<div class="note warn" style="margin:10px 0 0"><div><b>Re-sealed ×${b.resealed}</b> — this appears on ${b.rec.split(' ')[0]}'s receipt forever.</div></div>`:''}
   </div></div>
   ${c.ok?`<button class="btn danger" id="cxOpen">Cancel the booking ${b.mv}</button>`
    :b.mvSt==='ASSIGNED'||b.mvSt==='BOOKED'
     ?`<button class="btn danger" style="opacity:.55" id="cxDenied">Cancel the booking ${b.mv}</button>`
     :`<div class="note ${b.mvSt==='PICKED_UP'?'warn':'risk'}"><div>${c.why}</div></div>`}`);
  $('#backList').onclick=()=>{S.view=null;render();};
  if($('#cxOpen'))$('#cxOpen').onclick=()=>{
   const free=b.live&&D().freeUntil&&sceneMin<=(+D().freeUntil.slice(0,2)*60 + +D().freeUntil.slice(3));
   S.modal={type:'cancel',b,free:!!free};render();};
  if($('#cxDenied'))$('#cxDenied').onclick=()=>toast(c.why,true);
  return;
 }
 shell(`
  <div class="tiles">
   <div class="tile"><div class="v">${boxes.length}</div><div class="k">Boxes today</div></div>
   <div class="tile"><div class="v acc">${money(boxes.reduce((a,b)=>a+b.declared,0))}</div><div class="k">Declared · never on a label</div></div>
  </div>
  <div class="label" style="margin-top:0">Today's boxes — tap for detail</div>
  <div class="card">
   ${boxes.map(b=>`<button class="boxrow" style="width:100%;text-align:left;padding-left:14px;padding-right:14px" data-box="${b.box}">
     <div><div class="bid">${b.box} <span style="color:var(--faint);font-weight:600">· ${b.mv}</span></div>
      <div class="bfor">${b.rec} · ${b.svc}${b.by===U().short?' · yours':''}</div></div>
     <div class="sp"></div>${stPill(b.boxSt)}${stPill(b.mvSt)}</button>`).join('')}
  </div>
  <div class="note acc"><div><b>Cancelling:</b> ${S.role==='MANAGER'
   ?'as STORE_MANAGER you can cancel any booking that isn’t picked up yet.'
   :'as a rep you can cancel only bookings you made ('+D().boxRef+'). Chantal can cancel any, before pickup.'}
   The quote is always shown before the button.</div></div>`);
 document.querySelectorAll('[data-box]').forEach(b=>b.onclick=()=>{S.view=b.dataset.box;render();});
}

/* ── PICKUP · the 07:40 dock handover ── */
function vPickup(){
 const P=S.pickup;
 const manifest=S.boxes.filter(b=>['ASSIGNED','PICKED_UP'].includes(b.mvSt));
 const rows=manifest.map(b=>`<div class="boxrow">
   <div><div class="bid">${b.box} <span style="color:var(--faint);font-weight:600">· seal ${b.seal}</span></div>
    <div class="bfor">${b.mv} · ${b.rec}</div></div>
   <div class="sp"></div>${stPill(b.boxSt)}</div>`).join('')
  +`<div class="boxrow" style="opacity:.55">
   <div><div class="bid" style="color:var(--faint)">BX-7734</div>
    <div class="bfor">On the dock — not booked today; the driver's app will refuse it</div></div>
   <div class="sp"></div><span class="pill">NOT BOOKED</span></div>`;
 if(P.stage==='done'){
  shell(`
   <div class="hero"><div class="eyeb">Dock · pickup closed</div>
    <h2>Custody accepted by Maya C. · 4 boxes · 07:52</h2>
    <div class="m">Release code verified on her phone · you signed on her phone · seals matched the manifest.
     Two proofs, both directions — chained.</div></div>
   <div class="card"><div class="hd">This morning's manifest</div>${rows}</div>
   <div class="note acc"><div><b>Custody never lapses.</b> From 07:52 those 4 boxes are Maya's problem and the
    ledger's record — the store's day is the desk again.</div></div>`);
  return;
 }
 shell(`
  <div class="hero"><div class="eyeb">Dock · 07:40 pickup</div>
   <h2>Maya · MTL-03 · Kia Niro ${P.stage==='idle'?'is at the dock':'— release in progress'}</h2>
   <div class="m">4 boxes · ${money(S.boxes.reduce((a,b)=>a+b.declared,0))} declared · she scans each box ref and
    checks each seal against her manifest</div></div>
  ${P.stage!=='idle'?`
   <div class="hand">
    <h2>Release code — show it to no one but Maya</h2>
    <div class="sb">The driver types this into <b style="color:#fff">their</b> app — then you sign on their
     phone. Two proofs, both directions. Léa's delivery code is a different code; the store never sees it.</div>
    <div class="bigcode">${RELEASE_OTP}</div>
    <div class="hmeta"><span>TTL <b id="ttl">10:00</b></span><span>One movement set · one use</span></div>
   </div>`:''}
  <div class="card"><div class="hd">Manifest — 4 boxes for MTL-03
    <div class="sp"></div><span class="pill ${P.stage==='scanned'?'warn':'acc'}">${P.stage==='scanned'?'SCANNED ✓':'AWAITING DRIVER'}</span></div>
   ${rows}</div>
  ${P.stage==='idle'?`
   <button class="btn" id="askRelease">The driver asks for release — show the code</button>
   <div class="sighint">DEMO · MAYA HAS SCANNED HER MANIFEST AND TAPS “REQUEST RELEASE”</div>`
  :P.stage==='code'?`
   <button class="btn" id="simScan">DEMO · driver scanned all four — seals matched</button>`
  :`
   <div class="note acc appear"><div><b>All four scanned, seals matched.</b> Maya typed the code ✓ — now you sign
    on her phone to release custody.</div></div>
   <button class="btn" id="simSign">DEMO · you signed on Maya's phone</button>`}`);
 if($('#askRelease'))$('#askRelease').onclick=()=>{P.stage='code';P.ttl=600;
  toast('Release code live — it expires in 10:00');render();};
 if($('#simScan'))$('#simScan').onclick=()=>{
  manifest.forEach(b=>{b.boxSt='IN_CUSTODY';});P.stage='scanned';
  toast('BX-1042 · BX-8815 · BX-1049 · BX-ANJ0 scanned — seals matched the manifest');render();};
 if($('#simSign'))$('#simSign').onclick=()=>{
  manifest.forEach(b=>{b.mvSt='PICKED_UP';b.boxSt='IN_CUSTODY';});
  P.stage='done';
  chain('custody.accepted','M-4471…M-4474 · 4 boxes · Maya C. · code + signature · 07:52');
  toast('Custody accepted by Maya C. · 4 boxes · 07:52');render();};
}

/* ── LEDGER · STORE_MANAGER only — for STORE_REP this view is never rendered ── */
function vLedger(){
 if(S.role!=='MANAGER'){S.tab='desk';return vDesk();}
 const used=S.nextSeal-1-40000,total=5000;
 shell(`
  <div class="card"><div class="hd">Store ledger — today
    <div class="sp"></div><span class="pill acc">CHAIN OK</span></div>
   <div class="bd">
    <div class="kv"><span class="k">Chain head</span><span class="v mono">${S.ledger[0].h.replace('…','')}…</span></div>
    <div class="kv"><span class="k">Events (store scope)</span><span class="v">${S.ledger.length} today</span></div>
    <div class="kv"><span class="k">Daily Merkle root</span><span class="v mono" style="font-weight:600">anchored 07:00 · externally timestamped</span></div>
   </div></div>
  <div class="card"><div class="hd">Address-override review — ${S.queue.length} pending</div><div class="bd">
   ${S.queue.length?S.queue.map((o,i)=>`
    <div class="kv" style="align-items:flex-start"><span class="k">${o.mv} · ${o.box}<br>
      <span style="font-size:11px">${o.field} · by ${o.who} · ${o.at}</span><br>
      <span class="strike" style="font-size:11px">${o.from}</span> → <b style="font-size:11px;color:var(--ink)">${o.to}</b><br>
      <span style="font-size:11px">Reason: ${o.reason}</span></span>
     <span class="v"><button class="btn sm" style="min-height:32px;padding:0 10px;font-size:11px" data-qok="${i}">Approve</button><br>
      <button class="btn danger sm" style="min-height:32px;padding:0 10px;font-size:11px;margin-top:6px" data-qflag="${i}">Flag</button></span></div>`).join('')
   :'<div style="color:var(--muted);font-size:13px">Queue clear. Redirect fraud shows up here first — an empty queue is the good kind of boring.</div>'}
  </div></div>
  <div class="card"><div class="hd">Seal range — issued to this store</div><div class="bd">
   <div class="kv"><span class="k">Range</span><span class="v mono">CS-40001 – CS-45000</span></div>
   <div class="kv"><span class="k">Consumed through</span><span class="v mono">CS-${S.nextSeal-1} · next CS-${S.nextSeal}</span></div>
   <div class="rangebar"><i style="width:${Math.max(2,used/total*100)}%"></i></div>
   <div style="font-size:11px;color:var(--muted);margin-top:5px">${used} of ${total.toLocaleString()} used · dispatch alerts on exhaustion</div>
  </div></div>
  <div class="label">Event stream — newest first · store scope</div>
  <div class="card"><div class="bd" style="padding-top:4px;padding-bottom:4px">
   ${S.ledger.map(ev=>`<div class="ledrow"><span class="lt">${ev.t}</span>
     <div><div class="le">${ev.e}</div><div class="lr">${ev.r}</div></div>
     <span class="lh">${ev.h}</span></div>`).join('')}
  </div></div>
  <div class="note acc"><div><b>Store-scoped view.</b> Full hashes, chain verification and the anomaly board live
   in the DLIVERD admin console — this is your store's slice of the same chain.</div></div>`);
 document.querySelectorAll('[data-qok]').forEach(b=>b.onclick=()=>{
  const o=S.queue.splice(+b.dataset.qok,1)[0];
  chain('override.reviewed',o.mv+' · approved · '+U().short);
  toast(o.mv+' override approved — chained');render();});
 document.querySelectorAll('[data-qflag]').forEach(b=>b.onclick=()=>{
  const o=S.queue.splice(+b.dataset.qflag,1)[0];
  chain('override.flagged',o.mv+' · flagged to DLIVERD dispatch · '+U().short);
  toast(o.mv+' flagged to dispatch — they take it from here',true);render();});
}

/* ── PROFILE ── */
function vProfile(){
 const mgr=S.role==='MANAGER';
 const caps=mgr?[
   ['Pack, seal & book','<span class="pill acc">YES</span>'],
   ['Cancel bookings','<span class="pill acc">ANY · before pickup</span>'],
   ['Approve unseals','<span class="pill acc">YES — second person for reps</span>'],
   ['Approve address override > $2,000','<span class="pill acc">YES</span>'],
   ['Store ledger & review queue','<span class="pill acc">FULL</span>'],
   ['Own unseal — second code','<span class="pill warn">ANOTHER MGR / DISPATCH</span>']]
  :[
   ['Pack, seal & book','<span class="pill acc">YES</span>'],
   ['Cancel bookings','<span class="pill warn">OWN ONLY</span>'],
   ['Approve unseals','<span class="pill risk">NO — Chantal’s code</span>'],
   ['Approve address override > $2,000','<span class="pill risk">NO — needs Chantal</span>'],
   ['Store ledger','<span class="pill risk">NEVER — tab not rendered</span>'],
   ['Locked box (5 failed codes)','<span class="pill risk">SUPER_ADMIN ONLY</span>']];
 shell(`
  <div class="card"><div class="hd">${U().name} <div class="sp"></div><span class="pill acc">${U().role}</span></div>
   <div class="bd">
    <div class="kv"><span class="k">Role</span><span class="v">${U().title}</span></div>
    <div class="kv"><span class="k">Store</span><span class="v">${STORE.name}</span></div>
    <div class="kv"><span class="k">Address</span><span class="v" style="font-weight:600">${STORE.addr}</span></div>
    <div class="kv"><span class="k">Provider</span><span class="v">${STORE.prov}</span></div>
    <div class="kv"><span class="k">Today's driver</span><span class="v">Maya · MTL-03 · Kia Niro · 07:40</span></div>
   </div></div>
  <div class="card"><div class="hd">Scanner</div><div class="bd">
   <div class="kv"><span class="k">Mode</span><span class="v">
    <span style="display:inline-flex;border:1.5px solid var(--line-mid);border-radius:7px;overflow:hidden">
     ${[['CAM','📷 Camera'],['WEDGE','⌨ Wedge']].map(([k,l])=>`<button data-scanset="${k}" style="padding:6px 12px;font-size:12px;font-weight:800;${S.scan===k?'background:var(--acc);color:#fff':'color:var(--muted)'}">${l}</button>`).join('')}
    </span></span></div>
   <div style="font-size:11.5px;color:var(--muted);margin-top:6px">Wedge renders a focused input on the desk that
    the USB counter scanner types into. Camera uses the phone.</div>
  </div></div>
  <div class="card"><div class="hd">What this role can do</div><div class="bd">
   ${caps.map(c=>`<div class="kv"><span class="k">${c[0]}</span><span class="v">${c[1]}</span></div>`).join('')}
  </div></div>
  <div class="note acc"><div><b>DLIVERD never opens a box.</b> Shipper-attested contents, seal-verified custody —
   the roles above are about who may break that seal, and who watches them do it.</div></div>
  <button class="btn alt" id="switchRole">Switch role — back to the picker</button>
  <button class="btn ghost" id="lockApp">Lock the desk</button>`);
 document.querySelectorAll('[data-scanset]').forEach(b=>b.onclick=()=>{S.scan=b.dataset.scanset;
  toast(S.scan==='CAM'?'Camera scanning':'Wedge mode — scanner types into the desk');render();});
 $('#switchRole').onclick=()=>{S.gate='roles';toast('Pick a role — the app rebuilds around it');render();};
 $('#lockApp').onclick=()=>{S.gate='roles';toast('Desk locked');render();};
}

/* ── render ── */
function render(){
 tickClock();
 if(S.gate!=='app')return vGate();
 $('#gate').style.display='none';
 $('#app').style.display='flex';
 setChrome(false);
 if(S.role==='REP'&&S.tab==='ledger')S.tab='desk';
 if(S.tab==='desk')return vDesk();
 if(S.tab==='boxes')return vBoxes();
 if(S.tab==='pickup')return vPickup();
 if(S.tab==='ledger')return vLedger();
 return vProfile();
}
setInterval(tickClock,10000);
setInterval(()=>{ /* release-code TTL, updated in place — no re-render */
 if(S.pickup.stage==='code'||S.pickup.stage==='scanned'){
  if(S.pickup.ttl>0)S.pickup.ttl--;
  const el=$('#ttl');
  if(el)el.textContent=String(Math.floor(S.pickup.ttl/60)).padStart(2,'0')+':'+String(S.pickup.ttl%60).padStart(2,'0');
 }
},1000);
render();
</script>
</body></html>
