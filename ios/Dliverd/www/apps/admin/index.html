<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0C1211">
<title>Dliverd · Admin</title>
<style>
:root{
  --paper:#F3F6F4;--surface:#FFFFFF;--raise:#FAFBFA;--sunk:#EDF1EF;
  --ink:#111917;--body:#2B3733;--muted:#65726E;--faint:#8B9793;
  --line:#DCE1DE;--line-mid:#C3CBC7;
  --acc:#0F6455;--acc-ink:#0B4E42;--acc-soft:#E3EFEB;--acc-line:#9FC9BE;
  --risk:#93301F;--risk-soft:#F8E9E5;--risk-line:#DFB6AC;
  --warn:#7C5A0E;--warn-soft:#F6EEDC;
  --dark:#0C1211;--dark2:#141C1A;--dkl:#31403C;--dkm:#8B9994;--dka:#54C1A6;--dka2:#7FD5BF;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1400px 700px at 50% -12%,#2a3a36 0%,#121816 55%,#0b100f 100%) #0b100f;
  color:var(--body);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;line-height:1.45;overflow:hidden}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--ink);border:1.5px solid var(--line-mid);
  border-radius:6px;padding:9px 11px;background:var(--surface);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--mono)}
.sp{flex:1 1 auto}
/* ── console frame ── */
.console{display:flex;flex-direction:column;height:100vh}
.topbar{flex:0 0 48px;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--dark);
  border-bottom:1px solid #1E2A27;color:#C0CCC7;z-index:20}
.topbar .brand{font-weight:800;font-size:13px;letter-spacing:.16em;color:#EBF1EE}
.topbar .sub{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--dkm)}
.topbar .role{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dka2);border:1px solid #265F53;background:#12302A;border-radius:3px;padding:3px 7px}
.topbar .ticker{font-family:var(--mono);font-size:10px;color:var(--dkm)}
.topbar .ticker b{color:var(--dka)}
.topbar .clock{font-family:var(--mono);font-size:12px;font-weight:700;color:#EBF1EE}
.avatar{width:28px;height:28px;border-radius:50%;background:#12302A;border:1px solid #265F53;
  color:var(--dka2);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.frame{flex:1 1 auto;min-height:0;display:flex}
/* sidebar */
.side{flex:0 0 216px;background:var(--dark2);border-right:1px solid #1E2A27;display:flex;
  flex-direction:column;padding:14px 10px 12px;overflow-y:auto}
.side .grp{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  color:#5B6B66;margin:12px 8px 6px}
.side .grp:first-child{margin-top:0}
.nav-it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;
  border-radius:7px;color:var(--dkm);font-size:13px;font-weight:600;margin-bottom:2px}
.nav-it svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.nav-it:hover{background:#1A2422;color:#C0CCC7}
.nav-it.on{background:#12302A;color:var(--dka2)}
.nav-it .bdg{margin-left:auto;min-width:17px;height:17px;border-radius:9px;background:var(--risk);
  color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.nav-it .bdg.warn2{background:#7C5A0E}
.side .foot{margin-top:auto;padding:10px 8px 2px;font-family:var(--mono);font-size:8.5px;
  letter-spacing:.08em;text-transform:uppercase;color:#5B6B66;line-height:1.7}
.side .foot b{color:var(--dka)}
/* main pane */
.main{flex:1 1 auto;min-width:0;background:var(--paper);overflow-y:auto;padding:20px 24px 40px}
.pane{max-width:1060px}
.pagehead{display:flex;align-items:baseline;gap:12px;margin-bottom:4px;flex-wrap:wrap}
.pagehead h1{font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.pagehead .pd{font-size:12.5px;color:var(--muted)}
.label{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);margin:16px 2px 7px}
/* cards / pills / notes / kv — driver idioms */
.card{background:var(--surface);border:1px solid var(--line-mid);border-radius:10px;
  margin-bottom:14px;overflow:hidden}
.card .hd{display:flex;align-items:center;gap:9px;padding:11px 15px;background:var(--raise);
  border-bottom:1px solid var(--line);font-weight:800;color:var(--ink);font-size:13.5px}
.card .bd{padding:13px 15px}
.pill{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 7px;border:1px solid var(--line-mid);border-radius:3px;
  color:var(--muted);background:var(--surface);white-space:nowrap}
.pill.acc{color:var(--acc-ink);border-color:var(--acc-line);background:var(--acc-soft)}
.pill.risk{color:var(--risk);border-color:var(--risk-line);background:var(--risk-soft)}
.pill.warn{color:var(--warn);border-color:#DDC386;background:var(--warn-soft)}
.pill.dark{color:var(--dka2);border-color:#265F53;background:var(--dark)}
.note{display:flex;gap:9px;padding:11px 13px;font-size:12.5px;line-height:1.5;border-radius:8px;margin-bottom:12px}
.note.acc{background:var(--acc-soft);color:var(--acc-ink);border:1px solid var(--acc-line)}
.note.risk{background:var(--risk-soft);color:var(--risk);border:1px solid var(--risk-line)}
.note.warn{background:var(--warn-soft);color:var(--warn);border:1px solid #DDC386}
.note.plain{background:var(--surface);color:var(--muted);border:1px solid var(--line-mid)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)} .kv .v{color:var(--ink);font-weight:700;text-align:right}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;
  padding:0 16px;border-radius:7px;background:var(--acc);color:#fff;font-size:13px;font-weight:800}
.btn:active{transform:scale(.99)}
.btn.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line-mid);font-weight:700}
.btn.danger{background:var(--surface);color:var(--risk);border:1.5px solid var(--risk-line);font-weight:700}
.btn.ghost{background:none;color:var(--muted);font-weight:600;font-size:12.5px;min-height:32px}
.btn.sm{min-height:30px;font-size:11.5px;padding:0 11px;border-radius:6px}
.btn[disabled]{opacity:.45;cursor:default}
/* tables */
.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);text-align:left;font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line-mid);
  background:var(--raise);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--body);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.ref{font-family:var(--mono);font-size:11.5px;color:var(--ink);white-space:nowrap}
.tbl th.num,.tbl td.num{text-align:right;font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.tbl tr.rowbtn{cursor:pointer}
.tbl tr.rowbtn:hover td{background:var(--raise)}
/* ledger stream */
.chiprow{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 12px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  padding:6px 11px;border:1.5px solid var(--line-mid);border-radius:16px;color:var(--muted);background:var(--surface)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chainhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--dark);color:var(--dkm);
  border-radius:9px;padding:11px 14px;font-family:var(--mono);font-size:11px;margin-bottom:12px}
.chainhead b{color:var(--dka2);font-size:12px}
.chainhead .st{color:#EBF1EE}
.evt{display:flex;gap:10px;align-items:baseline;padding:7px 12px;border-bottom:1px solid var(--line);
  font-size:12px;transition:background .12s}
.evt:last-child{border-bottom:0}
.evt .t{font-family:var(--mono);font-size:10.5px;color:var(--faint);flex:0 0 78px;white-space:nowrap}
.evt .ty{font-family:var(--mono);font-size:10.5px;font-weight:700;flex:0 0 158px;color:var(--acc-ink);white-space:nowrap}
.evt .ty.risk{color:var(--risk)} .evt .ty.warn{color:var(--warn)} .evt .ty.adm{color:var(--ink)}
.evt .rf{flex:1 1 auto;min-width:0;color:var(--body)}
.evt .rf .mono{font-size:11px;color:var(--ink)}
.evt .ac{flex:0 0 148px;font-size:11px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evt .hs{flex:0 0 122px;font-family:var(--mono);font-size:10.5px;color:var(--faint);text-align:right;white-space:nowrap}
.evt .hs b{color:var(--acc-ink);font-weight:700}
.evt.scanning{background:var(--acc-soft)}
.evt.okd .hs b{color:var(--acc)}
.evt.broke{background:var(--risk-soft)}
.evt.broke .hs b{color:var(--risk)}
.evt.tampered .ty::after{content:" ·"; color:var(--risk)}
.daysep{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);background:var(--sunk);padding:5px 12px;border-bottom:1px solid var(--line)}
/* bars & meters */
.meter{height:9px;border-radius:5px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--acc)}
.meter i.warn{background:#B98A1B}
.meter i.risk{background:var(--risk)}
.bars{display:flex;align-items:flex-end;gap:8px;height:96px;padding:8px 2px 0}
.bars>div{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:5px}
.bars .b{width:100%;background:var(--acc-line);border-radius:4px 4px 0 0}
.bars .b.hi{background:var(--acc)}
.bars .d{font-family:var(--mono);font-size:9px;color:var(--faint)}
/* two-col grid */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.grid2 .card{margin-bottom:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 14px}
.tile{background:var(--surface);border:1px solid var(--line-mid);border-radius:10px;padding:12px 14px}
.tile .v{font-family:var(--mono);font-size:21px;font-weight:800;color:var(--ink);line-height:1}
.tile .v.acc{color:var(--acc)} .tile .v.risk{color:var(--risk)} .tile .v.warn{color:var(--warn)}
.tile .k{font-size:10.5px;color:var(--muted);margin-top:5px}
/* modal */
.ovl{position:fixed;inset:0;background:rgba(12,18,17,.5);z-index:80;display:flex;
  align-items:center;justify-content:center;padding:20px}
.modal{width:100%;max-width:440px;background:var(--surface);border-radius:12px;overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0,.45);animation:mpop .18s cubic-bezier(.2,1.3,.4,1)}
@keyframes mpop{0%{transform:scale(.94);opacity:0}100%{transform:none;opacity:1}}
.modal .mh{padding:14px 18px 0;font-size:15px;font-weight:800;color:var(--ink)}
.modal .mb{padding:10px 18px 4px;font-size:12.5px;color:var(--body);line-height:1.55}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px 16px}
.conseq{background:var(--warn-soft);border:1px solid #DDC386;color:var(--warn);border-radius:7px;
  padding:9px 11px;font-size:12px;line-height:1.5;margin:8px 0}
.conseq.risk{background:var(--risk-soft);border-color:var(--risk-line);color:var(--risk)}
.conseq.acc{background:var(--acc-soft);border-color:var(--acc-line);color:var(--acc-ink)}
/* toast */
.toast{position:fixed;right:22px;bottom:22px;transform:translateY(140%);background:var(--ink);
  color:#EBF1EE;font-size:13px;font-weight:700;padding:12px 17px;border-radius:8px;
  transition:transform .25s,opacity .25s;z-index:90;max-width:420px;opacity:0;pointer-events:none}
.toast.show{transform:none;opacity:1;pointer-events:auto}
/* anomaly cards */
.anom{display:flex;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line);align-items:flex-start}
.anom:last-child{border-bottom:0}
.anom .sig{flex:0 0 auto;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:15px;background:var(--sunk)}
.anom .sig.risk{background:var(--risk-soft);color:var(--risk)}
.anom .sig.warn{background:var(--warn-soft);color:var(--warn)}
.anom .sig.ok{background:var(--acc-soft);color:var(--acc-ink)}
.anom h4{font-size:13px;color:var(--ink)}
.anom p{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.anom p .mono{font-size:11px;color:var(--ink)}
.crumb{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);margin-bottom:10px}
.crumb button{color:var(--acc);font-weight:700;font-family:var(--mono);font-size:10px;
  letter-spacing:.08em;text-transform:uppercase}
@media (max-width:1000px){
  .side{flex-basis:176px}
  .grid2{grid-template-columns:1fr}
  .grid2 .card{margin-bottom:14px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .evt .ac{display:none}
}
@media (max-width:900px){
  .side{flex-basis:60px;padding:14px 7px}
  .side .grp,.side .foot,.nav-it span.lb{display:none}
  .nav-it{justify-content:center;padding:10px 0}
  .nav-it .bdg{position:absolute;margin:0;transform:translate(12px,-10px)}
  .nav-it{position:relative}
  .main{padding:16px 14px 40px}
  .topbar .ticker{display:none}
}
.sealimg{width:24px;height:24px;border-radius:5px;display:block}.mark>.sealimg{width:100%;height:100%;border-radius:inherit}
</style></head><body>

function runVerify(){
 if(S.verify.running)return;
 S.lf='all';S.verify={running:true,done:false,broken:false,at:-1};render();
 const rows=[...document.querySelectorAll('.evt')];
 let i=0;
 const step=setInterval(()=>{
  if(i>0){rows[i-1].classList.remove('scanning');rows[i-1].classList.add('okd');}
  if(i>=rows.length){clearInterval(step);
   S.verify={running:false,done:true,broken:false,at:-1};render();return;}
  const r=rows[i];r.classList.add('scanning');
  if(S.tampered&&+r.dataset.eq===412){clearInterval(step);
   r.classList.remove('scanning');r.classList.add('broke');
   setTimeout(()=>{S.verify={running:false,done:true,broken:true,at:412};render();
    toast('Chain break at evt 412 — recorded 07a7… ≠ recomputed 3c19…',true);},450);
   return;}
  i++;},70);
}
