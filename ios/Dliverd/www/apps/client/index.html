<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dliverd">
<meta name="theme-color" content="#0C1211">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>Dliverd Client</title>
<style>
:root{
  --paper:#F3F6F4;--surface:#FFFFFF;--raise:#FAFBFA;--sunk:#EDF1EF;
  --ink:#111917;--body:#2B3733;--muted:#65726E;--faint:#8B9793;
  --line:#DCE1DE;--line-mid:#C3CBC7;
  --acc:#0F6455;--acc-ink:#0B4E42;--acc-soft:#E3EFEB;--acc-line:#9FC9BE;
  --risk:#93301F;--risk-soft:#F8E9E5;--risk-line:#DFB6AC;
  --warn:#7C5A0E;--warn-soft:#F6EEDC;
  --dark:#0C1211;--dark2:#141C1A;--dkl:#31403C;--dkm:#8B9994;--dka:#54C1A6;--dka2:#7FD5BF;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1a2220}
body{margin:0;color:var(--body);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;line-height:1.45}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 16px;
  background:radial-gradient(1200px 600px at 50% -10%,#2a3a36 0%,#121816 55%,#0b100f 100%)}
.phone{width:390px;height:844px;background:#000;border-radius:54px;padding:11px;position:relative;
  box-shadow:0 0 0 1px #2c3331,0 28px 80px rgba(0,0,0,.55),inset 0 0 0 1px #3d4542}
.phone-screen{height:100%;background:var(--paper);border-radius:44px;overflow:hidden;position:relative;
  display:flex;flex-direction:column}
.island{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:118px;height:34px;
  background:#0a0d0c;border-radius:20px;z-index:40;pointer-events:none}
.osbar{position:absolute;top:0;left:0;right:0;height:54px;z-index:30;display:flex;align-items:flex-end;
  justify-content:space-between;padding:0 28px 10px;color:#111;font-size:14px;font-weight:700;
  pointer-events:none}
.osbar.light{color:#EBF1EE}
.osbar .sig{display:flex;align-items:center;gap:5px}
.osbar svg{display:block}
.homeind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:128px;height:5px;
  background:#111;border-radius:4px;opacity:.28;z-index:30;pointer-events:none}
.homeind.on-dark{background:#fff;opacity:.45}
#app,#gate{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#gate{background:var(--dark);color:#C0CCC7}
@media (max-width:480px){
  .stage{padding:0;background:#000;min-height:100dvh}
  .phone{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none}
  .phone-screen{border-radius:0}
}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
input{font-family:inherit;font-size:15px;color:var(--ink);border:1.5px solid var(--line-mid);
  border-radius:6px;padding:12px;background:var(--surface);width:100%}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
.mono{font-family:var(--mono)}
.sp{flex:1 1 auto}
.bar{flex:0 0 auto;z-index:10;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line-mid);padding-top:54px}
.bar .r1{display:flex;align-items:center;gap:10px;padding:8px 15px 10px}
.brand{font-weight:800;font-size:13.5px;letter-spacing:.16em;color:var(--ink)}
.sub{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.chip-on{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;
  padding:8px 14px;border-radius:20px;background:var(--acc);color:#fff}
.chip-on.off{background:var(--sunk);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#7FD5BF;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 16px}
.card{background:var(--surface);border:1px solid var(--line-mid);border-radius:10px;
  margin-bottom:12px;overflow:hidden}
.card .hd{display:flex;align-items:center;gap:9px;padding:12px 15px;background:var(--raise);
  border-bottom:1px solid var(--line);font-weight:800;color:var(--ink);font-size:14px}
.card .bd{padding:13px 15px}
.pill{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 7px;border:1px solid var(--line-mid);border-radius:3px;
  color:var(--muted);background:var(--surface);white-space:nowrap}
.pill.acc{color:var(--acc-ink);border-color:var(--acc-line);background:var(--acc-soft)}
.pill.risk{color:var(--risk);border-color:var(--risk-line);background:var(--risk-soft)}
.pill.warn{color:var(--warn);border-color:#DDC386;background:var(--warn-soft)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:50px;border-radius:8px;background:var(--acc);color:#fff;font-size:15.5px;font-weight:800}
.btn:active{transform:scale(.99)}
.btn.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line-mid);font-weight:700}
.btn.danger{background:var(--surface);color:var(--risk);border:1.5px solid var(--risk-line);font-weight:700}
.btn.ghost{background:none;color:var(--muted);min-height:40px;font-weight:600;font-size:13px}
.btn.sm{min-height:40px;font-size:13px;border-radius:7px}
.note{display:flex;gap:9px;padding:11px 13px;font-size:12.5px;line-height:1.5;border-radius:8px;margin-bottom:12px}
.note.acc{background:var(--acc-soft);color:var(--acc-ink);border:1px solid var(--acc-line)}
.note.risk{background:var(--risk-soft);color:var(--risk);border:1px solid var(--risk-line)}
.note.warn{background:var(--warn-soft);color:var(--warn);border:1px solid #DDC386}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)} .kv .v{color:var(--ink);font-weight:700;text-align:right}
.label{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);margin:14px 2px 7px}
.hero{background:var(--dark);border-radius:12px;color:#C0CCC7;padding:16px;margin-bottom:12px}
.hero .eyeb{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--dka)}
.hero h2{color:#fff;font-size:18px;font-weight:800;margin-top:6px;line-height:1.25}
.hero .m{font-size:12px;color:var(--dkm);margin-top:4px}
.offbanner{background:var(--risk);color:#fff;border-radius:9px;padding:12px 14px;margin-bottom:12px;
  font-size:12.5px;line-height:1.5;font-weight:600;animation:slidein .3s}
@keyframes slidein{0%{transform:translateY(-14px);opacity:0}100%{transform:none;opacity:1}}
.map{height:130px;border-bottom:1px solid var(--line)}
.drvdot{animation:pulse 1.4s infinite}
/* tracker step rail */
.tsteps{display:flex;background:var(--surface);border:1px solid var(--line-mid);border-radius:10px;
  padding:13px 8px 10px;margin-bottom:12px}
.ts{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.ts::before{content:'';position:absolute;top:5px;left:-50%;width:100%;height:2px;background:var(--line)}
.ts:first-child::before{display:none}
.ts i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-mid);background:var(--surface);z-index:1}
.ts.done i{border-color:var(--acc);background:var(--acc)}
.ts.now i{border-color:var(--acc);background:var(--surface);box-shadow:0 0 0 4px var(--acc-soft)}
.ts.done::before,.ts.now::before{background:var(--acc-line)}
.ts span{font-size:9px;font-weight:700;color:var(--faint);letter-spacing:.03em}
.ts.now span{color:var(--acc-ink)} .ts.done span{color:var(--muted)}
/* the code */
.codecard{background:var(--dark);border-radius:12px;padding:18px 16px 16px;text-align:center;
  color:#C0CCC7;margin-bottom:12px}
.codecard .eyeb{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dka)}
.codebig{font-family:var(--mono);font-size:46px;font-weight:800;color:#fff;letter-spacing:.14em;
  margin:10px 0 6px;user-select:all;-webkit-user-select:all;cursor:text;line-height:1.1}
.codemeta{font-family:var(--mono);font-size:10px;color:#6D7B76;letter-spacing:.04em}
.etarow{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:14px;
  color:var(--acc-ink);padding:10px 0 2px}
.etarow .gd{width:9px;height:9px;border-radius:50%;background:var(--acc);animation:pulse 1.4s infinite}
/* receipt */
.receipt{font-family:var(--mono);font-size:10.5px;line-height:1.65;background:var(--dark);color:#C8D4CF;
  border-radius:10px;padding:14px;white-space:pre;overflow-x:auto;margin-bottom:12px;
  user-select:text;-webkit-user-select:text}
.receipt .rhead{color:#fff;font-weight:700}
.receipt .rwarn{color:#E9C46A}
.receipt .rdim{color:#6D7B76}
/* NEW tab option cards */
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.optcard{background:var(--surface);border:1.5px solid var(--line-mid);border-radius:12px;padding:14px;
  text-align:left;display:flex;flex-direction:column;gap:6px;min-height:124px}
.optcard:active{background:var(--raise)}
.optcard svg{width:22px;height:22px;stroke:var(--acc);stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.optcard .t{font-size:15px;font-weight:800;color:var(--ink)}
.optcard .d{font-size:11px;color:var(--muted);line-height:1.4}
.optcard .p{font-family:var(--mono);font-size:11px;color:var(--acc-ink);font-weight:700;margin-top:auto}
/* service rows */
.svc{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line-mid);
  border-radius:10px;padding:11px 12px;background:var(--surface);margin-bottom:8px}
.svc.on{border-color:var(--acc);background:var(--acc-soft)}
.svc.dis{opacity:.6}
.svc .nm{font-size:13.5px;font-weight:800;color:var(--ink)}
.svc .wn{font-size:11px;color:var(--muted);margin-top:1px}
.svc .why{font-size:10.5px;color:var(--risk);margin-top:4px;font-weight:600;line-height:1.4}
.svc .pr{margin-left:auto;flex:0 0 auto;font-family:var(--mono);font-weight:800;color:var(--acc-ink);font-size:13px}
.chips{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.chipG{flex:1 1 40%;border:1.5px solid var(--line-mid);border-radius:8px;padding:9px 8px;text-align:left;background:var(--surface)}
.chipG.on{border-color:var(--acc);background:var(--acc-soft)}
.chipG .g{font-size:12.5px;font-weight:800;color:var(--ink);line-height:1.3}
.chipG .l{font-size:9.5px;color:var(--muted);margin-top:2px;line-height:1.25}
/* order rows */
.orow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;
  border-bottom:1px solid var(--line);background:var(--surface)}
.orow:last-child{border-bottom:0}
.orow:active{background:var(--raise)}
.orow .ref{font-family:var(--mono);font-weight:800;font-size:13px;color:var(--ink)}
.orow .sm2{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
.navrow{display:flex;gap:7px;margin-top:9px}
.navbtn{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:6px;min-height:38px;
  border:1.5px solid var(--line-mid);border-radius:7px;font-size:12px;font-weight:700;color:var(--ink);
  background:var(--surface);text-decoration:none}
.navbtn:active{background:var(--raise)}
.navbtn svg{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.done-wrap{text-align:center;padding:22px 20px 16px}
.done-ring{width:86px;height:86px;border-radius:50%;background:var(--acc-soft);margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;color:var(--acc);
  animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
.done-wrap h2{font-size:19px;color:var(--ink)}
.done-wrap p{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.55}
/* bottom nav */
.nav{flex:0 0 auto;z-index:10;display:flex;background:rgba(255,255,255,.9);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line-mid);padding:7px 0 22px}
.nav button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--faint);font-size:9px;font-weight:700;padding:4px 0;position:relative}
.nav button.on{color:var(--acc)}
.nav svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-2px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;
  background:var(--risk);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;
  justify-content:center;padding:0 4px}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%) translateY(120%);
  background:var(--ink);color:#EBF1EE;font-size:13px;font-weight:700;padding:11px 17px;
  border-radius:8px;transition:transform .25s,opacity .25s;z-index:60;max-width:86%;text-align:center;
  opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.splash{height:100%;display:flex;flex-direction:column;align-items:center;padding:120px 28px 36px;text-align:center}
.splash .mark{width:76px;height:76px;border-radius:18px;background:#0F6455;display:flex;
  align-items:center;justify-content:center;margin-bottom:18px}
.splash .mark svg{width:42px;height:20px}
.splash h1{color:#fff;font-size:28px;letter-spacing:.18em;font-weight:800}
.splash p{color:var(--dkm);margin-top:8px;font-size:13px;line-height:1.55}
.splash .tok{font-family:var(--mono);font-size:10px;color:#6D7B76;margin-top:20px;letter-spacing:.06em}
.sighint{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:#6D7B76;text-align:center;padding:6px 0 8px}
.sheet{position:absolute;inset:0;background:rgba(12,18,17,.45);z-index:50;display:flex;align-items:flex-end}
.sheet .panel{width:100%;background:var(--surface);border-radius:16px 16px 0 0;padding:16px 16px 32px}
.sheet .panel h3{font-size:16px;color:var(--ink)}
.sheet .body{font-size:12.5px;color:var(--body);line-height:1.55;margin-top:10px}
.sheet .opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sheet .opts button{min-height:46px;border-radius:10px;border:1.5px solid var(--line-mid);
  background:var(--raise);font-weight:700;font-size:14px}
.sealimg{width:24px;height:24px;border-radius:5px;display:block}.mark>.sealimg{width:100%;height:100%;border-radius:inherit}
.mark{background:none!important}
</style></head><body>

function receiptHtml(o){
 const P=[];
 P.push(`<span class="rhead">DLIVERD — Delivery receipt</span>              ${o.ref}`);
 P.push(`Box ${o.box} · Seal ${o.seal}`);
 if(o.sealCount>1)P.push(`<span class="rwarn">⚠ This box was opened and re-sealed once before dispatch.</span>`);
 P.push('');
 P.push(`Declared contents (declared by ${o.provider} — not verified by DLIVERD)`);
 o.items.forEach(it=>P.push('  '+it));
 P.push('');
 P.push('Custody');
 o.custody.forEach(c=>P.push(`  ${c[0]}  ${c[1]}`));
 P.push(`         ${o.geo}`);
 P.push('');
 P.push(`<span class="rdim">Chain  ${o.chain}    Verify: dliverd.ca/v/${o.ref}</span>`);
 return `<div class="receipt">${P.join('\n')}</div>`;
}

function openSheet(title,opts,onPick){
 const wrap=document.createElement('div');
 wrap.className='sheet';
 wrap.innerHTML=`<div class="panel"><h3>${title}</h3>
  <div class="opts">${opts.map((o,i)=>`<button data-i="${i}">${o}</button>`).join('')}
  <button class="btn ghost" id="sheetCancel">Cancel</button></div></div>`;
 $('.phone-screen').appendChild(wrap);
 wrap.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{wrap.remove();onPick(opts[+b.dataset.i]);});
 wrap.querySelector('#sheetCancel').onclick=()=>wrap.remove();
 wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.remove();});
}

 document.querySelectorAll('[data-win]').forEach(b=>b.onclick=()=>{S.pu.win=b.dataset.win;render();});
 document.querySelectorAll('[data-dest]').forEach(b=>b.onclick=()=>{S.pu.dest=b.dataset.dest;render();});
 $('#back').onclick=()=>{S.view=null;render();};
 $('#book').onclick=()=>{
  const ref='M-'+(S.nextRef++);
  S.orders.unshift({ref,kind:'PICKUP',provider:'You',to:S.pu.dest,ticket:'—',
   box:'assigned at pickup',seal:'sealed at your door',sealCount:1,items:['1 × device — sealed at pick-up'],
   declared:0,service:'REPRISE',price:9.75,status:'BOOKED',date:'Mon 24 Aug',
   window:S.pu.win,deliveredAt:null,signer:null,geo:null,chain:null,custody:[]});
  toast(ref+' booked · REPRISE · $9.75 · '+S.pu.win);
  S.tab='orders';S.view=ref;render();};
}
function vReturn(){
 const delivered=S.orders.filter(o=>o.status==='DELIVERED');
 const reasons=['Wrong item received','Defective on arrival','Changed my mind — 14 days','Damage found in the box'];
 shell(`
  <div class="card"><div class="hd">Return to the store <div class="sp"></div><span class="pill warn">RMA</span></div>
   <div class="bd">
    <div class="label" style="margin-top:0">Which order is going back?</div>
    ${delivered.map(o=>`<button class="chipG ${S.ret.ref===o.ref?'on':''}" data-rref="${o.ref}" style="flex:1 1 100%;margin-bottom:7px">
      <div class="g mono">${o.ref} · ${o.provider}</div>
      <div class="l">${o.items.join(' · ')} · delivered ${o.date}</div></button>`).join('')}
    <div class="label">Why is it going back?</div>
    <div class="chips">${reasons.map(r=>`<button class="chipG ${S.ret.reason===r?'on':''}" data-rr="${r}">
      <div class="g">${r}</div></button>`).join('')}</div>
   </div></div>
  <div class="note acc"><div><b>A return is its own movement</b> — a REPRISE with its own box, its own seal,
   its own code and its own receipt. It is not a leg of the original delivery; the original's chain stays closed.</div></div>
  <button class="btn" id="book">Book the return leg · $9.75</button>
  <button class="btn ghost" id="back">Back</button>`);
 document.querySelectorAll('[data-rref]').forEach(b=>b.onclick=()=>{S.ret.ref=b.dataset.rref;render();});
 document.querySelectorAll('[data-rr]').forEach(b=>b.onclick=()=>{S.ret.reason=b.dataset.rr;render();});
 $('#back').onclick=()=>{S.view=null;render();};
 $('#book').onclick=()=>{
  if(!S.ret.ref)return toast('Pick the order that is going back',true);
  if(!S.ret.reason)return toast('Pick a reason — the store sees it on the RMA',true);
  const orig=S.orders.find(o=>o.ref===S.ret.ref);
  const ref='M-'+(S.nextRef++);
  S.orders.unshift({ref,kind:'RETURN',provider:'You',to:orig.provider,linked:orig.ref,ticket:'RMA · '+orig.ticket,
   box:'assigned at pickup',seal:'sealed at your door',sealCount:1,items:orig.items.slice(),
   declared:orig.declared,service:'REPRISE',price:9.75,status:'BOOKED',date:'Mon 24 Aug',
   window:'Tomorrow · 09:00 – 12:00',reason:S.ret.reason,deliveredAt:null,signer:null,geo:null,chain:null,custody:[]});
  toast(ref+' booked — a separate movement returning '+orig.ref+"'s items to "+orig.provider);
  S.ret={ref:null,reason:null};S.tab='orders';S.view=ref;render();};
}
function vCancel(){
 const open=openOrders(), held=custodyOrders();
 shell(`
  <div class="card"><div class="hd">Cancel a movement</div><div class="bd" style="font-size:12.5px;color:var(--muted);line-height:1.55">
   Free before a driver is assigned · $3.50 once assigned · impossible after pickup.
   The consequence is always shown <b>before</b> the button.</div></div>
  ${open.length?`<div class="label">Open — can still be cancelled</div>
   <div class="card">${open.map(o=>`<div class="orow" style="cursor:default">
    <div style="flex:1 1 auto"><div class="ref">${o.ref} ${statusPill(o)}</div>
     <div class="sm2">${o.items.join(' · ')} · ${o.window}</div>
     <div class="sm2" style="color:var(--acc-ink);font-weight:700">${o.status==='BOOKED'?'Free — no driver assigned yet':'$3.50 — a driver planned around it'}</div></div>
    <button class="btn danger sm" style="width:auto;padding:0 14px" data-cx="${o.ref}">Cancel</button></div>`).join('')}</div>`
  :`<div class="card"><div class="bd" style="color:var(--muted);font-size:13px">Nothing to cancel — no open bookings right now. Book one from New, or check Orders for history.</div></div>`}
  ${held.map(o=>`<div class="note warn"><div><b>${o.ref} can't be cancelled — it's in custody.</b>
    Maya has the sealed box in her car. A movement in custody only goes forward (delivery) or comes back
    (a REPRISE return). Once it's delivered, book a Return.</div></div>`).join('')}
  <button class="btn ghost" id="back">Back</button>`);
 document.querySelectorAll('[data-cx]').forEach(b=>b.onclick=()=>cancelFlow(S.orders.find(o=>o.ref===b.dataset.cx)));
 $('#back').onclick=()=>{S.view=null;render();};
}

/* ── ORDERS ── */
function orderRow(o){
 const who=o.kind==='INBOUND'?o.provider+' → you':o.kind==='SHIP'?'You → '+o.to:o.kind==='RETURN'?'You → '+o.to+' (RMA)':'You → '+o.to;
 return `<button class="orow" data-open="${o.ref}">
  <div style="flex:1 1 auto"><div class="ref">${o.ref} ${statusPill(o)}${o.sealCount>1?' <span class="pill warn">re-sealed</span>':''}</div>
   <div class="sm2">${who} · ${o.items[0]}${o.items.length>1?' +'+(o.items.length-1):''}</div>
   <div class="sm2">${o.date} · ${o.window}</div></div>
  <span style="color:var(--faint)">›</span></button>`;
}
function vOrders(){
 if(S.view){const o=S.orders.find(x=>x.ref===S.view);if(o)return vOrderDetail(o);}
 const live=S.orders.filter(o=>['BOOKED','ASSIGNED','PICKED_UP','EXCEPTION'].includes(o.status));
 const hist=S.orders.filter(o=>!live.includes(o));
 shell(`
  ${live.length?`<div class="label" style="margin-top:2px">In motion</div>
   <div class="card">${live.map(orderRow).join('')}</div>`:''}
  <div class="label">History — every movement keeps its receipt</div>
  <div class="card">${hist.length?hist.map(orderRow).join(''):'<div class="bd" style="color:var(--muted);font-size:13px">No closed movements yet.</div>'}</div>
  <div class="note acc"><div><b>Receipts verify themselves.</b> Each carries its hash chain —
   paste the Verify link anywhere, anytime, no account needed.</div></div>`);
 document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{S.view=b.dataset.open;render();});
}
function vOrderDetail(o){
 const claim=S.claims.find(c=>c.ref===o.ref);
 const canCancel=['BOOKED','ASSIGNED'].includes(o.status);
 const isToday=o.ref==='M-4471';
 shell(`
  <button class="btn ghost" id="back" style="justify-content:flex-start;padding-left:2px">‹ All orders</button>
  <div class="card"><div class="hd">${o.ref} <div class="sp"></div>${statusPill(o)}</div>
   <div class="bd">
    <div class="kv"><span class="k">${o.kind==='INBOUND'?'From':'To'}</span>
     <span class="v">${o.kind==='INBOUND'?o.provider:o.to}</span></div>
    ${o.linked?`<div class="kv"><span class="k">Returns</span><span class="v mono">${o.ref===o.linked?'—':o.linked}</span></div>`:''}
    <div class="kv"><span class="k">Ticket</span><span class="v mono">${o.ticket}</span></div>
    <div class="kv"><span class="k">Box · seal</span><span class="v mono">${o.box} · ${o.seal}</span></div>
    <div class="kv"><span class="k">Contents</span><span class="v" style="font-weight:600">${o.items.join(' · ')}</span></div>
    <div class="kv"><span class="k">Declared by</span><span class="v" style="font-weight:600">${o.kind==='INBOUND'?o.provider:'you'} — not verified by DLIVERD</span></div>
    ${o.declared?`<div class="kv"><span class="k">Declared value</span><span class="v">$${o.declared.toLocaleString()}</span></div>`:''}
    <div class="kv"><span class="k">Service</span><span class="v">${o.service} · ${fmt$(o.price)}</span></div>
    <div class="kv"><span class="k">${o.status==='DELIVERED'?'Delivered':'Window'}</span><span class="v">${o.window} · ${o.date}</span></div>
    ${o.reason?`<div class="kv"><span class="k">RMA reason</span><span class="v" style="font-weight:600">${o.reason}</span></div>`:''}
   </div></div>
  ${o.sealCount>1?`<div class="note warn"><div><b>⚠ This box was opened and re-sealed once before dispatch.</b>
   The store broke seal CS-33802 to correct the contents, and the ledger kept both events. You see it
   because honesty is the product.</div></div>`:''}
  ${claim?`<div class="note risk"><div><b>Claim ${claim.id} is open.</b> ${claim.reason} · filed on <b>${claim.binding}</b>.</div></div>`:''}
  ${o.status==='DELIVERED'?`<div class="label">Receipt</div>${receiptHtml(o)}
   ${isToday?`<button class="btn alt" id="report">Report an issue · open until Tue 25 Aug, 08:47</button>`
   :`<div class="sighint" style="color:var(--faint)">REPORT WINDOW CLOSED — 24 H AFTER DELIVERY</div>`}`:''}
  ${canCancel?`<button class="btn danger sm" id="cx" style="margin-top:10px">Cancel ${o.ref}${o.status==='BOOKED'?' · free':' · $3.50'}</button>`:''}
  ${o.status==='PICKED_UP'?`<div class="note warn"><div><b>In custody — can't be cancelled.</b> The sealed box is
   in the driver's car: forward (delivery) or back (REPRISE) are the only moves left.</div></div>`:''}`);
 $('#back').onclick=()=>{S.view=null;render();};
 if($('#report'))$('#report').onclick=()=>reportSheet(o);
 if($('#cx'))$('#cx').onclick=()=>cancelFlow(o);
}

 document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;
  toast(S.lang==='FR'?'Textos en français — parfait':'Texts in English — done');render();});
 document.querySelectorAll('[data-nt]').forEach(b=>b.onclick=()=>{const k=b.dataset.nt;
  S.notif[k]=!S.notif[k];toast(S.notif[k]?'SMS on':'SMS off');render();});
 $('#dataReq').onclick=()=>toast('Data export queued — an SMS link arrives within 24 h');
 $('#purge').onclick=()=>confirmSheet('Purge your data now?',
  `<b>Everything personal goes.</b> Tracking links stop working and receipts already texted to you stay
   yours, but DLIVERD keeps only the anonymised ledger hashes the law requires. Open movements must
   finish first. Confirmed by SMS within 24 h — that's your Loi 25 right, no forms, no phone tree.`,
  'Purge my data',()=>toast('Purge request filed — SMS confirmation within 24 h'),true);
 $('#hCall').onclick=()=>toast('Calling DLIVERD · 24/7');
 $('#hSms').onclick=()=>toast('Opening SMS · réponse en ~5 min');
 $('#hVer').onclick=()=>toast('dliverd.ca/v/… — paste any receipt chain, no account needed');

/* ── gate / splash — no PIN: the SMS token IS the auth ── */
function vGate(){
 $('#app').style.display='none';
 $('#gate').style.display='flex';
 setChrome(true);
 $('#gate').innerHTML=`<div class="splash">
   <div class="mark">${SEALD}</div>
   <h1>DLIVERD</h1>
   <p>Opens from the SMS link · no account, no app store.<br>Secure delivery services · Montréal</p>
   <div class="tok">dliverd.ca/t/8f3k2q… · TOKENISED · LOI 25</div>
  </div>`;
 setTimeout(()=>{if(S.gate==='splash'){S.gate='app';render();}},1400);
}

/* approaching countdown — the arrival creeps closer */
setInterval(()=>{
 if(S.gate==='app'&&S.trk===2&&!S.exc&&S.etaMin>2){
  S.etaMin--;
  if(S.tab==='track')render();
 }
},20000);

function render(){
 tickClock();
 if(S.gate!=='app')return vGate();
 $('#gate').style.display='none';
 $('#app').style.display='flex';
 setChrome(false);
 if(S.tab==='track')return vTrack();
 if(S.tab==='new')return vNew();
 if(S.tab==='orders')return vOrders();
 return vProfile();
}
setInterval(tickClock,10000);
render();
</script>
</body></html>
