<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C1211">
<title>Dliverd</title>
<style>
:root{
  --paper:#F3F6F4;--ink:#111917;--muted:#65726E;--faint:#8B9793;
  --acc:#0F6455;--acc-soft:#E3EFEB;--acc-line:#9FC9BE;
  --dark:#0C1211;--dark2:#141C1A;--dkl:#31403C;--dkm:#8B9994;--dka:#54C1A6;--dka2:#7FD5BF;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;color:#C0CCC7;
  background:radial-gradient(1200px 600px at 50% -10%,#2a3a36 0%,#121816 55%,#0b100f 100%) #0b100f;
  padding:max(48px,env(safe-area-inset-top)) 20px max(40px,env(safe-area-inset-bottom))}
.wrap{max-width:980px;margin:0 auto}
.mark{width:76px;height:76px;border-radius:18px;background:var(--acc);display:flex;
  align-items:center;justify-content:center;margin:0 auto 18px}
h1{color:#fff;font-size:30px;letter-spacing:.18em;font-weight:800;text-align:center}
.tag{color:var(--dkm);text-align:center;margin-top:8px;font-size:13.5px}
.sub{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dka);text-align:center;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:22px}
a.app{display:block;text-decoration:none;background:var(--dark2);border:1px solid var(--dkl);
  border-radius:14px;padding:16px 16px 14px;color:#C0CCC7;transition:transform .12s}
a.app:active{transform:scale(.985)}
a.app:hover{border-color:var(--dka);background:#182220}
.role{display:flex;align-items:baseline;gap:8px}
.role h2{color:#fff;font-size:17px;font-weight:800}
.pill{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 7px;border:1px solid var(--dkl);border-radius:3px;color:var(--dkm);margin-left:auto;white-space:nowrap}
.pill.acc{color:var(--dka2);border-color:#265F53;background:#12302A}
.who{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dka);margin-top:2px}
.app p{font-size:12.5px;line-height:1.55;color:var(--dkm);margin-top:8px}
.keys{font-family:var(--mono);font-size:10.5px;color:#6D7B76;margin-top:10px;line-height:1.6}
.keys b{color:var(--dka2);font-weight:700}
.foot{text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:#4A5854;margin-top:28px;line-height:2}
.lockup{background:#fff;border-radius:18px;padding:10px 26px;max-width:540px;margin:0 auto}.lockup img{display:block;width:100%;height:auto}

#hub .langsw{display:flex;margin:18px auto 0}

.langsw{display:inline-flex;border:1.5px solid var(--line-mid,#31403C);border-radius:8px;overflow:hidden;flex:0 0 auto}
.langsw button{min-width:40px;padding:6px 11px;font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.06em;background:transparent;color:var(--muted,#8B9994)}
.langsw button.on{background:var(--acc,#0F6455);color:#fff}
</style></head><body>

<script>
'use strict';

const LANG_KEY='dliverd.lang';
function loadLang(){
 try{
  const q=new URLSearchParams(location.search).get('lang');
  if(q==='FR'||q==='EN'){try{localStorage.setItem(LANG_KEY,q);}catch(e){}return q;}
  const v=localStorage.getItem(LANG_KEY);
  if(v==='FR'||v==='EN')return v;
 }catch(e){}
 return 'FR';
}
function saveLang(l){
 try{localStorage.setItem(LANG_KEY,l);}catch(e){}
 try{const u=new URL(location.href);u.searchParams.set('lang',l);history.replaceState(null,'',u);}catch(e){}
}
let LANG=loadLang();
function tx(en,fr){return LANG==='FR'?fr:en;}
function langSw(){
 return `<span class="langsw" role="group" aria-label="${tx('Language','Langue')}">${['FR','EN'].map(l=>`<button type="button" data-setlang="${l}" class="${LANG===l?'on':''}">${l}</button>`).join('')}</span>`;
}
function wireLang(){
 document.querySelectorAll('[data-setlang]').forEach(b=>b.onclick=()=>{
  LANG=b.dataset.setlang;saveLang(LANG);
  if(typeof S!=='undefined')S.lang=LANG;
  document.documentElement.lang=LANG==='FR'?'fr':'en';
  render();
 });
}
document.documentElement.lang=LANG==='FR'?'fr':'en';

function appHref(rel){
 const q=new URLSearchParams();
 q.set('lang',LANG);
 if(new URLSearchParams(location.search).has('native'))q.set('native','1');
 return rel+'?'+q.toString();
}
function render(){
 document.documentElement.lang=LANG==='FR'?'fr':'en';
 const hub=document.getElementById('hub');
 hub.innerHTML=`
  ${langSw()}
  <div class="sub">${tx('Pick a role — every app is a live demo','Choisissez un rôle — chaque appli est une démo live')}</div>
  <div class="grid">
    <a class="app" href="${appHref('apps/driver/index.html')}">
      <div class="role"><h2>${tx('Driver','Chauffeur')}</h2><span class="pill acc">iPhone</span></div>
